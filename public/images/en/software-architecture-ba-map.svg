<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Software architecture map for the order cancellation scenario</title>
  <desc id="desc">Customers and support interact with a shopping platform containing customer channels, an order service, an order database, and an integration worker. The platform depends on payment and warehouse systems.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="60" y="58" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#0f2942">Read architecture from the business journey</text>
  <text x="60" y="88" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">Follow the rule, authoritative data, dependencies, and failure outcomes across the system boundary.</text>

  <rect x="42" y="177" width="142" height="88" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="113" cy="202" r="7" fill="#f59e0b"/>
  <text x="113" y="226" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2942">Customer</text>
  <text x="113" y="248" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#64748b">requests cancellation</text>

  <rect x="42" y="357" width="142" height="88" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="113" cy="382" r="7" fill="#38bdf8"/>
  <text x="113" y="406" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2942">Support</text>
  <text x="113" y="428" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#64748b">explains the result</text>

  <rect x="220" y="125" width="665" height="430" rx="24" fill="#ecfeff" stroke="#0f766e" stroke-width="3" stroke-dasharray="10 7"/>
  <text x="248" y="160" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#115e59">SHOPPING PLATFORM — SYSTEM BOUNDARY</text>
  <text x="248" y="184" font-family="Inter, Arial, sans-serif" font-size="13" fill="#0f766e">Responsibilities inside the boundary still need explicit owners.</text>

  <rect x="270" y="220" width="190" height="94" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="2" filter="url(#shadow)"/>
  <text x="365" y="257" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2942">Customer channels</text>
  <text x="365" y="283" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#64748b">Web, mobile, Support UI</text>

  <rect x="510" y="220" width="190" height="94" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="2" filter="url(#shadow)"/>
  <text x="605" y="257" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2942">Order Service</text>
  <text x="605" y="283" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#64748b">authorization + rules</text>

  <rect x="510" y="387" width="190" height="94" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="2" filter="url(#shadow)"/>
  <ellipse cx="605" cy="423" rx="34" ry="10" fill="#bae6fd" stroke="#0369a1" stroke-width="2"/>
  <path d="M571 423v27c0 6 15 11 34 11s34-5 34-11v-27" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="605" y="475" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2942">Order Database</text>

  <rect x="720" y="304" width="145" height="116" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="2" filter="url(#shadow)"/>
  <text x="792" y="340" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2942">Integration</text>
  <text x="792" y="362" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2942">worker</text>
  <text x="792" y="390" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#64748b">retry + deduplicate</text>
  <text x="792" y="408" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#64748b">reconcile</text>

  <rect x="945" y="190" width="205" height="100" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2" filter="url(#shadow)"/>
  <text x="1048" y="230" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#7c2d12">Payment provider</text>
  <text x="1048" y="258" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#9a3412">financial follow-up</text>

  <rect x="945" y="390" width="205" height="100" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2" filter="url(#shadow)"/>
  <text x="1048" y="430" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#7c2d12">Warehouse system</text>
  <text x="1048" y="458" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#9a3412">stop packing + confirm</text>

  <path d="M184 220 H270" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M184 398 H235 V290 H270" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M460 267 H502" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="481" y="253" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#0f766e">request</text>
  <path d="M605 314 V379" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="620" y="352" font-family="Inter, Arial, sans-serif" font-size="11" fill="#0f766e">authoritative state</text>
  <path d="M700 267 C800 245 835 240 937 240" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="820" y="225" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#0f766e">refund command / result</text>
  <path d="M700 285 C712 294 724 307 738 324" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M865 380 C898 401 913 429 937 438" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="90" y="602" width="1020" height="78" rx="18" fill="#0f2942"/>
  <text x="120" y="634" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">BA reading path</text>
  <text x="120" y="660" font-family="Inter, Arial, sans-serif" font-size="15" fill="#bae6fd">Business rule → boundary → responsibility → source of truth → dependency → failure outcome → measurable evidence</text>
</svg>
