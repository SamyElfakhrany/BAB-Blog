<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">BRD decision blueprint</title>
  <desc id="desc">A BRD moves from a business need and evidence through outcomes, scope, requirements, and review to an approved decision. A traceability chain connects the need to validation evidence.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#17324d" flood-opacity="0.14"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#244968"/></marker>
  </defs>
  <rect width="1200" height="720" fill="#f7f3ea"/>
  <text x="600" y="58" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#17324d">A BRD is a decision path, not a document dump</text>
  <text x="600" y="91" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#567083">Connect evidence, boundaries, requirements, and authority</text>

  <g filter="url(#shadow)">
    <rect x="42" y="145" width="202" height="190" rx="20" fill="#fff1cc" stroke="#e3ad2f" stroke-width="3"/>
    <circle cx="143" cy="145" r="24" fill="#e3ad2f"/><text x="143" y="153" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d">1</text>
    <text x="143" y="198" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#17324d">NEED &amp; EVIDENCE</text>
    <text x="143" y="237" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4b6478">Problem · opportunity</text>
    <text x="143" y="264" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4b6478">baseline · affected people</text>
    <text x="143" y="304" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#956000">Why change?</text>

    <rect x="270" y="145" width="202" height="190" rx="20" fill="#e3effc" stroke="#4c86b8" stroke-width="3"/>
    <circle cx="371" cy="145" r="24" fill="#4c86b8"/><text x="371" y="153" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">2</text>
    <text x="371" y="198" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#17324d">OUTCOMES</text>
    <text x="371" y="237" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4b6478">Objectives · measures</text>
    <text x="371" y="264" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4b6478">targets · owners</text>
    <text x="371" y="304" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#2c6596">What value?</text>

    <rect x="498" y="145" width="202" height="190" rx="20" fill="#f1e7fa" stroke="#8a66a6" stroke-width="3"/>
    <circle cx="599" cy="145" r="24" fill="#8a66a6"/><text x="599" y="153" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">3</text>
    <text x="599" y="198" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#17324d">BOUNDARIES</text>
    <text x="599" y="237" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4b6478">Scope · stakeholders</text>
    <text x="599" y="264" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4b6478">context · decisions</text>
    <text x="599" y="304" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#6e4a8a">Where and who?</text>

    <rect x="726" y="145" width="202" height="190" rx="20" fill="#fde7df" stroke="#c76738" stroke-width="3"/>
    <circle cx="827" cy="145" r="24" fill="#c76738"/><text x="827" y="153" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">4</text>
    <text x="827" y="198" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#17324d">REQUIREMENTS</text>
    <text x="827" y="237" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4b6478">Rules · quality · risks</text>
    <text x="827" y="264" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4b6478">exceptions · transition</text>
    <text x="827" y="304" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#a44722">What must hold?</text>

    <rect x="954" y="145" width="204" height="190" rx="20" fill="#e2f4ee" stroke="#3a9b83" stroke-width="3"/>
    <circle cx="1056" cy="145" r="24" fill="#3a9b83"/><text x="1056" y="153" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">5</text>
    <text x="1056" y="198" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#17324d">REVIEW &amp; APPROVAL</text>
    <text x="1056" y="237" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4b6478">V&amp;V · conditions</text>
    <text x="1056" y="264" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4b6478">authority · baseline</text>
    <text x="1056" y="304" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#23745f">What is decided?</text>
  </g>

  <path d="M244 240 H260" stroke="#244968" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M472 240 H488" stroke="#244968" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M700 240 H716" stroke="#244968" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M928 240 H944" stroke="#244968" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="94" y="408" width="1012" height="184" rx="26" fill="#173b59" filter="url(#shadow)"/>
  <text x="600" y="448" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#f4bf45">TRACEABILITY SPINE</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">
    <text x="190" y="505">Business need</text>
    <text x="395" y="505">Business req.</text>
    <text x="600" y="505">Stakeholder req.</text>
    <text x="805" y="505">Solution / transition</text>
    <text x="1010" y="505">Evidence &amp; measures</text>
  </g>
  <g stroke="#77c9b5" stroke-width="4" marker-end="url(#arrow)">
    <path d="M270 500 H315"/><path d="M475 500 H520"/><path d="M680 500 H725"/><path d="M885 500 H930"/>
  </g>
  <text x="600" y="557" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#d8e6ef">Every requirement has a reason, owner, relationship, and way to validate it</text>
  <rect x="260" y="628" width="680" height="54" rx="27" fill="#ffffff" stroke="#cfc6b7" stroke-width="2"/>
  <text x="600" y="662" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d">Concise core document + maintained linked detail</text>
</svg>
