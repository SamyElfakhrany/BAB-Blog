<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">Evidence-based UX review loop</title><desc id="d">User goal and context lead to heuristic review, prioritized issues, design changes, and validation.</desc><rect width="1200" height="630" fill="#171335"/><g font-family="Arial" text-anchor="middle"><text x="600" y="72" fill="#fff" font-size="38" font-weight="700">Review the experience, not personal taste</text><text x="600" y="112" fill="#dcd5ff" font-size="21">Goal → evidence → principle → risk → validation</text><g font-size="24" font-weight="700"><rect x="55" y="245" width="190" height="120" rx="20" fill="#f7c948"/><text x="150" y="298" fill="#171335">User goal</text><text x="150" y="330" fill="#171335" font-size="17" font-weight="400">Return one item</text><rect x="285" y="245" width="190" height="120" rx="20" fill="#fff"/><text x="380" y="290" fill="#171335">Heuristic</text><text x="380" y="322" fill="#4c437b" font-size="17" font-weight="400">Status • control</text><text x="380" y="346" fill="#4c437b" font-size="17" font-weight="400">errors • consistency</text><rect x="515" y="245" width="190" height="120" rx="20" fill="#9b8ad9"/><text x="610" y="298" fill="#171335">Issue + risk</text><text x="610" y="330" fill="#171335" font-size="17" font-weight="400">Evidence and impact</text><rect x="745" y="245" width="190" height="120" rx="20" fill="#77a6d3"/><text x="840" y="298" fill="#102a43">Change</text><text x="840" y="330" fill="#102a43" font-size="17" font-weight="400">Smallest useful fix</text><rect x="975" y="245" width="170" height="120" rx="20" fill="#7dd3a8"/><text x="1060" y="298" fill="#102a43">Validate</text><text x="1060" y="330" fill="#102a43" font-size="17" font-weight="400">Test the task</text></g><g stroke="#dcd5ff" stroke-width="7" fill="none"><path d="M245 305h35M475 305h35M705 305h35M935 305h35"/></g><text x="600" y="495" fill="#fff" font-size="25" font-weight="700">“The confirmation is missing” is actionable.</text><text x="600" y="535" fill="#dcd5ff" font-size="22">“I do not like this screen” is not.</text></g></svg>
