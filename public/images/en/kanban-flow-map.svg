<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#081b2b"/><g font-family="Arial"><text x="600" y="62" text-anchor="middle" fill="#fff" font-size="34" font-weight="700">Manage flow by limiting work in progress</text><g text-anchor="middle"><rect x="55" y="130" width="250" height="380" rx="18" fill="#12344d"/><text x="180" y="175" fill="#fff" font-size="24" font-weight="700">Ready</text><rect x="80" y="215" width="200" height="70" rx="10" fill="#ff8a3d"/><text x="180" y="258" fill="#081b2b" font-size="18">Return policy</text><rect x="80" y="305" width="200" height="70" rx="10" fill="#ff8a3d"/><text x="180" y="348" fill="#081b2b" font-size="18">Courier rules</text><rect x="335" y="130" width="250" height="380" rx="18" fill="#12344d"/><text x="460" y="175" fill="#fff" font-size="24" font-weight="700">Analysis · WIP 2</text><rect x="360" y="215" width="200" height="70" rx="10" fill="#8ee3c5"/><text x="460" y="258" fill="#081b2b" font-size="18">Eligibility</text><rect x="360" y="305" width="200" height="70" rx="10" fill="#ef5b5b"/><text x="460" y="340" fill="#fff" font-size="18">Refund message</text><text x="460" y="362" fill="#fff" font-size="14">BLOCKED</text><rect x="615" y="130" width="250" height="380" rx="18" fill="#12344d"/><text x="740" y="175" fill="#fff" font-size="24" font-weight="700">Delivery · WIP 2</text><rect x="640" y="215" width="200" height="70" rx="10" fill="#65b9ff"/><text x="740" y="258" fill="#081b2b" font-size="18">Return request</text><rect x="895" y="130" width="250" height="380" rx="18" fill="#12344d"/><text x="1020" y="175" fill="#fff" font-size="24" font-weight="700">Done</text><rect x="920" y="215" width="200" height="70" rx="10" fill="#d8f4ea"/><text x="1020" y="258" fill="#081b2b" font-size="18">Reference number</text><text x="600" y="570" fill="#cfe8f5" font-size="21">Stop starting. Finish, unblock, and measure elapsed time.</text></g></g></svg>
