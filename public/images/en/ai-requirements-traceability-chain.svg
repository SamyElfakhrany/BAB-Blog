<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">AI requirements traceability chain</title>
  <desc id="desc">Six connected steps from business need and context through release and monitoring.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07152d"/>
      <stop offset="1" stop-color="#142f4d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#020617" flood-opacity=".34"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#5eead4"/>
    </marker>
  </defs>
  <rect width="1200" height="700" rx="34" fill="url(#bg)"/>
  <circle cx="1095" cy="80" r="145" fill="#2563eb" opacity=".10"/>
  <circle cx="95" cy="630" r="180" fill="#14b8a6" opacity=".08"/>
  <text x="70" y="72" fill="#f8fafc" font-family="Arial, sans-serif" font-size="34" font-weight="700">AI requirements traceability chain</text>
  <text x="70" y="108" fill="#b9ccdf" font-family="Arial, sans-serif" font-size="18">Turn a promising idea into evidence that supports a responsible decision.</text>

  <g fill="none" stroke="#5eead4" stroke-width="4" opacity=".82" marker-end="url(#arrow)">
    <path d="M365 229 H431"/>
    <path d="M768 229 H834"/>
    <path d="M995 314 V374"/>
    <path d="M835 465 H769"/>
    <path d="M432 465 H366"/>
  </g>

  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <g transform="translate(65 145)">
      <rect width="300" height="168" rx="22" fill="#102a43" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="38" cy="38" r="22" fill="#0ea5e9"/><text x="38" y="45" fill="white" font-size="20" font-weight="700" text-anchor="middle">1</text>
      <text x="70" y="44" fill="#f8fafc" font-size="22" font-weight="700">Need &amp; context</text>
      <text x="24" y="84" fill="#cbd5e1" font-size="17"><tspan x="24">Outcome, users, affected people,</tspan><tspan x="24" dy="26">current process and decision.</tspan></text>
      <rect x="24" y="132" width="177" height="23" rx="11" fill="#0e7490" opacity=".55"/><text x="112" y="149" fill="#e0f2fe" font-size="13" text-anchor="middle">Why does this exist?</text>
    </g>
    <g transform="translate(432 145)">
      <rect width="336" height="168" rx="22" fill="#102a43" stroke="#2dd4bf" stroke-width="2"/>
      <circle cx="38" cy="38" r="22" fill="#14b8a6"/><text x="38" y="45" fill="white" font-size="20" font-weight="700" text-anchor="middle">2</text>
      <text x="70" y="44" fill="#f8fafc" font-size="22" font-weight="700">Scope &amp; behavior</text>
      <text x="24" y="84" fill="#cbd5e1" font-size="17"><tspan x="24">Inputs, outputs, permissions,</tspan><tspan x="24" dy="26">boundaries, workflow and fallback.</tspan></text>
      <rect x="24" y="132" width="203" height="23" rx="11" fill="#0f766e" opacity=".55"/><text x="125" y="149" fill="#ccfbf1" font-size="13" text-anchor="middle">What may the system do?</text>
    </g>
    <g transform="translate(835 145)">
      <rect width="300" height="168" rx="22" fill="#102a43" stroke="#818cf8" stroke-width="2"/>
      <circle cx="38" cy="38" r="22" fill="#6366f1"/><text x="38" y="45" fill="white" font-size="20" font-weight="700" text-anchor="middle">3</text>
      <text x="70" y="44" fill="#f8fafc" font-size="22" font-weight="700">Quality &amp; controls</text>
      <text x="24" y="84" fill="#cbd5e1" font-size="17"><tspan x="24">Metrics, slices, limits, data,</tspan><tspan x="24" dy="26">oversight, safety and security.</tspan></text>
      <rect x="24" y="132" width="180" height="23" rx="11" fill="#4338ca" opacity=".55"/><text x="114" y="149" fill="#e0e7ff" font-size="13" text-anchor="middle">How good is enough?</text>
    </g>
    <g transform="translate(835 382)">
      <rect width="300" height="168" rx="22" fill="#102a43" stroke="#f59e0b" stroke-width="2"/>
      <circle cx="38" cy="38" r="22" fill="#d97706"/><text x="38" y="45" fill="white" font-size="20" font-weight="700" text-anchor="middle">4</text>
      <text x="70" y="44" fill="#f8fafc" font-size="22" font-weight="700">Scenarios &amp; evals</text>
      <text x="24" y="84" fill="#cbd5e1" font-size="17"><tspan x="24">Happy paths, boundaries, failures,</tspan><tspan x="24" dy="26">misuse and representative cases.</tspan></text>
      <rect x="24" y="132" width="183" height="23" rx="11" fill="#b45309" opacity=".55"/><text x="115" y="149" fill="#fef3c7" font-size="13" text-anchor="middle">How will we test it?</text>
    </g>
    <g transform="translate(432 382)">
      <rect width="336" height="168" rx="22" fill="#102a43" stroke="#f472b6" stroke-width="2"/>
      <circle cx="38" cy="38" r="22" fill="#db2777"/><text x="38" y="45" fill="white" font-size="20" font-weight="700" text-anchor="middle">5</text>
      <text x="70" y="44" fill="#f8fafc" font-size="22" font-weight="700">Evidence &amp; ownership</text>
      <text x="24" y="84" fill="#cbd5e1" font-size="17"><tspan x="24">Test set, result, limitations,</tspan><tspan x="24" dy="26">accountable owner and decision log.</tspan></text>
      <rect x="24" y="132" width="218" height="23" rx="11" fill="#9d174d" opacity=".55"/><text x="133" y="149" fill="#fce7f3" font-size="13" text-anchor="middle">What proves the requirement?</text>
    </g>
    <g transform="translate(65 382)">
      <rect width="300" height="168" rx="22" fill="#102a43" stroke="#4ade80" stroke-width="2"/>
      <circle cx="38" cy="38" r="22" fill="#16a34a"/><text x="38" y="45" fill="white" font-size="20" font-weight="700" text-anchor="middle">6</text>
      <text x="70" y="44" fill="#f8fafc" font-size="22" font-weight="700">Release &amp; monitor</text>
      <text x="24" y="84" fill="#cbd5e1" font-size="17"><tspan x="24">Go, change, pause or stop—then</tspan><tspan x="24" dy="26">watch value, risk and drift.</tspan></text>
      <rect x="24" y="132" width="194" height="23" rx="11" fill="#15803d" opacity=".55"/><text x="121" y="149" fill="#dcfce7" font-size="13" text-anchor="middle">What happens next?</text>
    </g>
  </g>

  <rect x="65" y="598" width="1070" height="57" rx="18" fill="url(#accent)" opacity=".16" stroke="#5eead4" stroke-width="1.5"/>
  <text x="600" y="634" fill="#e6fffb" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Keep one traceable record: need → risk → requirement → test → evidence → decision</text>
</svg>
