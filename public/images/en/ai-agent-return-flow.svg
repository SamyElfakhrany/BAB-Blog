<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">AI agent workflow for an online-store return</title>
  <desc id="desc">A loop from customer goal through context, planning, tool use, and result checking, with a human approval gate before high-impact actions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#18233b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity=".32"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L12 6L0 12Z" fill="#67e8f9"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="28" fill="url(#bg)"/>
  <text x="70" y="72" fill="#f8fafc" font-family="Arial, sans-serif" font-size="34" font-weight="700">A safe agent loop for order returns</text>
  <text x="70" y="108" fill="#a5b4fc" font-family="Arial, sans-serif" font-size="19">The agent can adapt its next step—but only inside defined tools, permissions, and approval rules.</text>

  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <rect x="70" y="170" width="190" height="120" rx="18" fill="#1e293b" stroke="#67e8f9" stroke-width="2"/>
    <text x="165" y="210" text-anchor="middle" fill="#67e8f9" font-size="17" font-weight="700">1 · GOAL</text>
    <text x="165" y="244" text-anchor="middle" fill="#f8fafc" font-size="21" font-weight="700">Request a return</text>
    <text x="165" y="270" text-anchor="middle" fill="#cbd5e1" font-size="15">Customer states the outcome</text>

    <rect x="300" y="170" width="190" height="120" rx="18" fill="#1e293b" stroke="#67e8f9" stroke-width="2"/>
    <text x="395" y="210" text-anchor="middle" fill="#67e8f9" font-size="17" font-weight="700">2 · CONTEXT</text>
    <text x="395" y="244" text-anchor="middle" fill="#f8fafc" font-size="21" font-weight="700">Read trusted facts</text>
    <text x="395" y="270" text-anchor="middle" fill="#cbd5e1" font-size="15">Order + current policy</text>

    <rect x="530" y="170" width="190" height="120" rx="18" fill="#1e293b" stroke="#67e8f9" stroke-width="2"/>
    <text x="625" y="210" text-anchor="middle" fill="#67e8f9" font-size="17" font-weight="700">3 · DECIDE</text>
    <text x="625" y="244" text-anchor="middle" fill="#f8fafc" font-size="21" font-weight="700">Choose next step</text>
    <text x="625" y="270" text-anchor="middle" fill="#cbd5e1" font-size="15">Proceed, retry, or escalate</text>

    <rect x="760" y="170" width="190" height="120" rx="18" fill="#1e293b" stroke="#67e8f9" stroke-width="2"/>
    <text x="855" y="210" text-anchor="middle" fill="#67e8f9" font-size="17" font-weight="700">4 · ACT</text>
    <text x="855" y="244" text-anchor="middle" fill="#f8fafc" font-size="21" font-weight="700">Use a tool</text>
    <text x="855" y="270" text-anchor="middle" fill="#cbd5e1" font-size="15">Draft case or ask approval</text>

    <rect x="990" y="170" width="140" height="120" rx="18" fill="#1e293b" stroke="#67e8f9" stroke-width="2"/>
    <text x="1060" y="210" text-anchor="middle" fill="#67e8f9" font-size="17" font-weight="700">5 · CHECK</text>
    <text x="1060" y="244" text-anchor="middle" fill="#f8fafc" font-size="21" font-weight="700">Observe</text>
    <text x="1060" y="270" text-anchor="middle" fill="#cbd5e1" font-size="15">Done or loop?</text>
  </g>

  <g fill="none" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)">
    <path d="M260 230H292"/>
    <path d="M490 230H522"/>
    <path d="M720 230H752"/>
    <path d="M950 230H982"/>
    <path d="M1060 298V350C1060 380 1035 395 1005 395H675C640 395 625 372 625 340V300"/>
  </g>
  <text x="822" y="382" text-anchor="middle" fill="#67e8f9" font-family="Arial, sans-serif" font-size="16" font-weight="700">NEW EVIDENCE FEEDS THE NEXT DECISION</text>

  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <rect x="200" y="460" width="800" height="130" rx="24" fill="#312e81" stroke="#a5b4fc" stroke-width="2"/>
    <circle cx="272" cy="525" r="38" fill="#f59e0b"/>
    <path d="M272 501v30M272 545h.1" stroke="#111827" stroke-width="8" stroke-linecap="round"/>
    <text x="335" y="505" fill="#fde68a" font-size="18" font-weight="700">HUMAN APPROVAL GATE</text>
    <text x="335" y="539" fill="#f8fafc" font-size="23" font-weight="700">Pause before issuing a refund or making another high-impact change.</text>
    <text x="335" y="567" fill="#c7d2fe" font-size="16">The BA defines the threshold, approver, timeout, and evidence the reviewer receives.</text>
  </g>
  <path d="M855 298V445" fill="none" stroke="#f59e0b" stroke-width="4" stroke-dasharray="9 9" marker-end="url(#arrow)"/>
  <text x="70" y="640" fill="#94a3b8" font-family="Arial, sans-serif" font-size="15">Illustrative design — actual permissions and return rules must be confirmed by the organization.</text>
</svg>
