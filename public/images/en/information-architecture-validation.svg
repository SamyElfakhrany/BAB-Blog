<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">Information architecture validation loop</title><desc id="d">Content inventory and user mental models inform a hierarchy that is checked with card sorting and tree testing.</desc><rect width="1200" height="630" fill="#f7f9fb"/><g font-family="Arial" text-anchor="middle"><text x="600" y="66" fill="#102a43" font-size="38" font-weight="700">Structure content around findable tasks</text><rect x="470" y="115" width="260" height="82" rx="16" fill="#40366f"/><text x="600" y="165" fill="#fff" font-size="25" font-weight="700">Return an order</text><g font-size="21" font-weight="700"><rect x="105" y="275" width="235" height="88" rx="15" fill="#77a6d3"/><text x="222" y="328" fill="#102a43">Orders</text><rect x="482" y="275" width="235" height="88" rx="15" fill="#9b8ad9"/><text x="600" y="328" fill="#171335">Returns &amp; refunds</text><rect x="860" y="275" width="235" height="88" rx="15" fill="#7dd3a8"/><text x="977" y="328" fill="#102a43">Help</text></g><g stroke="#40366f" stroke-width="5" fill="none"><path d="M600 197v35H222v38M600 232v38M600 232h377v38"/></g><rect x="250" y="440" width="700" height="95" rx="18" fill="#fff" stroke="#9b8ad9" stroke-width="3"/><text x="600" y="478" fill="#102a43" font-size="23" font-weight="700">Validate labels and grouping</text><text x="600" y="512" fill="#486581" font-size="19">Card sort to learn the mental model • Tree test to check findability</text></g></svg>
