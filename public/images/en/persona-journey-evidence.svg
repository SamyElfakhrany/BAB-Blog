<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">Evidence becomes product understanding</title><desc id="d">Research observations are synthesized into a persona, empathy map, and journey map, then translated into opportunities.</desc><rect width="1200" height="630" fill="#151b2b"/><g font-family="Arial" text-anchor="middle"><text x="600" y="70" fill="#fff" font-size="38" font-weight="700">Synthesis is a chain of evidence</text><g font-size="23" font-weight="700"><rect x="45" y="220" width="190" height="145" rx="20" fill="#77a6d3"/><text x="140" y="275" fill="#102a43">Research</text><text x="140" y="311" font-size="17" font-weight="400" fill="#102a43">quotes • actions</text><text x="140" y="338" font-size="17" font-weight="400" fill="#102a43">analytics • context</text><rect x="275" y="220" width="190" height="145" rx="20" fill="#fff"/><text x="370" y="275" fill="#102a43">Persona</text><text x="370" y="311" font-size="17" font-weight="400" fill="#486581">goals • behaviours</text><text x="370" y="338" font-size="17" font-weight="400" fill="#486581">constraints</text><rect x="505" y="220" width="190" height="145" rx="20" fill="#f7c948"/><text x="600" y="275" fill="#102a43">Empathy map</text><text x="600" y="311" font-size="17" font-weight="400" fill="#102a43">says • does</text><text x="600" y="338" font-size="17" font-weight="400" fill="#102a43">thinks • feels</text><rect x="735" y="220" width="190" height="145" rx="20" fill="#9b8ad9"/><text x="830" y="275" fill="#171335">Journey</text><text x="830" y="311" font-size="17" font-weight="400" fill="#171335">steps • touchpoints</text><text x="830" y="338" font-size="17" font-weight="400" fill="#171335">pain points</text><rect x="965" y="220" width="190" height="145" rx="20" fill="#7dd3a8"/><text x="1060" y="275" fill="#102a43">Opportunity</text><text x="1060" y="311" font-size="17" font-weight="400" fill="#102a43">question • owner</text><text x="1060" y="338" font-size="17" font-weight="400" fill="#102a43">measure</text></g><g stroke="#dcd5ff" stroke-width="7"><path d="M240 292h30M470 292h30M700 292h30M930 292h30"/></g><text x="600" y="485" fill="#fff" font-size="26" font-weight="700">Every statement should trace back to observed evidence.</text><text x="600" y="525" fill="#c5ccdb" font-size="20">Unknowns stay labelled as assumptions—not facts about “the user.”</text></g></svg>
