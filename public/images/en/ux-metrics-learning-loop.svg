<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">UX learning loop from behavior to outcomes</title><desc id="d">A task and hypothesis lead to usability observation, product metrics, a decision, and another iteration.</desc><rect width="1200" height="630" fill="#f7f9fb"/><g font-family="Arial" text-anchor="middle"><text x="600" y="70" fill="#102a43" font-size="38" font-weight="700">Combine explanation with measurement</text><circle cx="600" cy="325" r="190" fill="none" stroke="#9b8ad9" stroke-width="10" stroke-dasharray="250 55"/><g font-size="21" font-weight="700"><rect x="485" y="112" width="230" height="74" rx="16" fill="#f7c948"/><text x="600" y="157" fill="#102a43">Task + hypothesis</text><rect x="810" y="270" width="250" height="90" rx="16" fill="#77a6d3"/><text x="935" y="307" fill="#102a43">Qualitative test</text><text x="935" y="337" fill="#102a43" font-size="16" font-weight="400">Why and where?</text><rect x="475" y="465" width="250" height="90" rx="16" fill="#7dd3a8"/><text x="600" y="502" fill="#102a43">Product metrics</text><text x="600" y="532" fill="#102a43" font-size="16" font-weight="400">How many and how much?</text><rect x="140" y="270" width="250" height="90" rx="16" fill="#40366f"/><text x="265" y="307" fill="#fff">Decision</text><text x="265" y="337" fill="#dcd5ff" font-size="16" font-weight="400">change • keep • investigate</text></g><text x="600" y="305" fill="#102a43" font-size="27" font-weight="700">User outcome</text><text x="600" y="343" fill="#486581" font-size="20">success • effort • confidence</text></g></svg>
