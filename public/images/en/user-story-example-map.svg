<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#081b2b"/><g font-family="Arial" text-anchor="middle"><text x="600" y="65" fill="#fff" font-size="34" font-weight="700">A story is a conversation anchored by examples</text><rect x="70" y="185" width="250" height="250" rx="20" fill="#ff8a3d"/><text x="195" y="240" fill="#081b2b" font-size="25" font-weight="700">User outcome</text><text x="195" y="292" fill="#081b2b" font-size="18">Start an eligible return</text><text x="195" y="326" fill="#081b2b" font-size="18">without calling support</text><rect x="475" y="145" width="250" height="330" rx="20" fill="#173a54" stroke="#8ee3c5" stroke-width="3"/><text x="600" y="205" fill="#8ee3c5" font-size="25" font-weight="700">Story + conversation</text><text x="600" y="262" fill="#fff" font-size="18">Who needs what?</text><text x="600" y="302" fill="#fff" font-size="18">Why does it matter?</text><text x="600" y="342" fill="#fff" font-size="18">Rules and risks?</text><text x="600" y="382" fill="#fff" font-size="18">Smallest useful slice?</text><rect x="880" y="185" width="250" height="250" rx="20" fill="#65b9ff"/><text x="1005" y="240" fill="#081b2b" font-size="25" font-weight="700">Confirmation</text><text x="1005" y="292" fill="#081b2b" font-size="18">Given context</text><text x="1005" y="326" fill="#081b2b" font-size="18">When action</text><text x="1005" y="360" fill="#081b2b" font-size="18">Then observable result</text><path d="M330 310H460" stroke="#8ee3c5" stroke-width="8"/><path d="M450 297l18 13-18 13" fill="#8ee3c5"/><path d="M735 310H865" stroke="#65b9ff" stroke-width="8"/><path d="M855 297l18 13-18 13" fill="#65b9ff"/><text x="600" y="555" fill="#cfe8f5" font-size="21">The card starts the discussion; acceptance examples make the boundary testable.</text></g></svg>
