<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">AI monitoring and response loop</title>
  <desc id="desc">A seven-step loop from live evidence through detection, triage, containment, investigation, recovery, and learning, centered on intended use and version context.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071426"/><stop offset="1" stop-color="#173554"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f766e"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#020617" flood-opacity=".38"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#5eead4"/></marker>
  </defs>
  <rect width="1200" height="720" rx="34" fill="url(#bg)"/>
  <circle cx="1080" cy="90" r="190" fill="#2563eb" opacity=".08"/><circle cx="80" cy="650" r="210" fill="#14b8a6" opacity=".07"/>
  <text x="600" y="62" fill="#f8fafc" font-family="Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle">AI monitoring and response loop</text>
  <text x="600" y="96" fill="#b9ccdf" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">Every signal needs context, ownership, and a decision route.</text>

  <g fill="none" stroke="#5eead4" stroke-width="4" opacity=".82" marker-end="url(#arrow)">
    <path d="M347 194 C408 155 470 142 520 140"/><path d="M704 145 C764 160 820 190 850 223"/>
    <path d="M963 326 C967 379 951 421 919 453"/><path d="M805 553 C755 590 691 605 635 607"/>
    <path d="M458 606 C395 598 337 569 300 532"/><path d="M190 432 C169 388 170 340 184 302"/>
    <path d="M257 229 C280 207 302 195 328 184"/>
  </g>

  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(85 125)"><rect width="270" height="128" rx="20" fill="#102a43" stroke="#38bdf8" stroke-width="2"/><circle cx="31" cy="31" r="19" fill="#0ea5e9"/><text x="31" y="38" fill="white" font-size="17" font-weight="700" text-anchor="middle">1</text><text x="61" y="37" fill="#f8fafc" font-size="20" font-weight="700">Observe</text><text x="20" y="73" fill="#cbd5e1" font-size="15"><tspan x="20">Live technical, human, value</tspan><tspan x="20" dy="22">and impact evidence</tspan></text><text x="20" y="113" fill="#7dd3fc" font-size="13">Version • population • time</text></g>
    <g transform="translate(465 110)"><rect width="270" height="128" rx="20" fill="#102a43" stroke="#2dd4bf" stroke-width="2"/><circle cx="31" cy="31" r="19" fill="#14b8a6"/><text x="31" y="38" fill="white" font-size="17" font-weight="700" text-anchor="middle">2</text><text x="61" y="37" fill="#f8fafc" font-size="20" font-weight="700">Detect</text><text x="20" y="73" fill="#cbd5e1" font-size="15"><tspan x="20">Threshold, report, severe case</tspan><tspan x="20" dy="22">or material change</tspan></text><text x="20" y="113" fill="#5eead4" font-size="13">Signal • coverage • delay</text></g>
    <g transform="translate(835 190)"><rect width="270" height="128" rx="20" fill="#102a43" stroke="#a78bfa" stroke-width="2"/><circle cx="31" cy="31" r="19" fill="#7c3aed"/><text x="31" y="38" fill="white" font-size="17" font-weight="700" text-anchor="middle">3</text><text x="61" y="37" fill="#f8fafc" font-size="20" font-weight="700">Triage</text><text x="20" y="73" fill="#cbd5e1" font-size="15"><tspan x="20">Validate, classify severity,</tspan><tspan x="20" dy="22">scope and owner</tspan></text><text x="20" y="113" fill="#c4b5fd" font-size="13">Case • impact • uncertainty</text></g>
    <g transform="translate(855 398)"><rect width="270" height="128" rx="20" fill="#102a43" stroke="#fb7185" stroke-width="2"/><circle cx="31" cy="31" r="19" fill="#e11d48"/><text x="31" y="38" fill="white" font-size="17" font-weight="700" text-anchor="middle">4</text><text x="61" y="37" fill="#f8fafc" font-size="20" font-weight="700">Contain</text><text x="20" y="73" fill="#cbd5e1" font-size="15"><tspan x="20">Restrict, bypass, pause or</tspan><tspan x="20" dy="22">preserve evidence</tspan></text><text x="20" y="113" fill="#fda4af" font-size="13">Authority • fallback • exposure</text></g>
    <g transform="translate(555 528)"><rect width="270" height="128" rx="20" fill="#102a43" stroke="#f59e0b" stroke-width="2"/><circle cx="31" cy="31" r="19" fill="#d97706"/><text x="31" y="38" fill="white" font-size="17" font-weight="700" text-anchor="middle">5</text><text x="61" y="37" fill="#f8fafc" font-size="20" font-weight="700">Investigate</text><text x="20" y="73" fill="#cbd5e1" font-size="15"><tspan x="20">Find affected cases and cause;</tspan><tspan x="20" dy="22">communicate as approved</tspan></text><text x="20" y="113" fill="#fcd34d" font-size="13">Trace • notify • decide</text></g>
    <g transform="translate(210 510)"><rect width="270" height="128" rx="20" fill="#102a43" stroke="#4ade80" stroke-width="2"/><circle cx="31" cy="31" r="19" fill="#16a34a"/><text x="31" y="38" fill="white" font-size="17" font-weight="700" text-anchor="middle">6</text><text x="61" y="37" fill="#f8fafc" font-size="20" font-weight="700">Recover</text><text x="20" y="73" fill="#cbd5e1" font-size="15"><tspan x="20">Correct, retest, approve and</tspan><tspan x="20" dy="22">restore—or retire</tspan></text><text x="20" y="113" fill="#86efac" font-size="13">Evidence • rollback • residual risk</text></g>
    <g transform="translate(55 310)"><rect width="270" height="128" rx="20" fill="#102a43" stroke="#f472b6" stroke-width="2"/><circle cx="31" cy="31" r="19" fill="#db2777"/><text x="31" y="38" fill="white" font-size="17" font-weight="700" text-anchor="middle">7</text><text x="61" y="37" fill="#f8fafc" font-size="20" font-weight="700">Learn &amp; reevaluate</text><text x="20" y="73" fill="#cbd5e1" font-size="15"><tspan x="20">Update requirements, evals,</tspan><tspan x="20" dy="22">controls and monitoring</tspan></text><text x="20" y="113" fill="#f9a8d4" font-size="13">Change • regression • next review</text></g>
  </g>

  <circle cx="600" cy="356" r="112" fill="url(#core)" filter="url(#shadow)"/><circle cx="600" cy="356" r="91" fill="#0b1f36" opacity=".75"/>
  <text x="600" y="322" fill="#f8fafc" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle">Intended use</text><text x="600" y="354" fill="#f8fafc" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle">+ live version</text><text x="600" y="389" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Scope • risk • owner • baseline</text>
  <rect x="115" y="681" width="970" height="25" rx="13" fill="#0f766e" opacity=".4"/><text x="600" y="699" fill="#d5fffa" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">The BA keeps every signal traceable to meaning, evidence, authority and action.</text>
</svg>
