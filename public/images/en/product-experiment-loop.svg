<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#081b2b"/><g font-family="Arial" text-anchor="middle"><text x="600" y="62" fill="#fff" font-size="34" font-weight="700">Use an MVP to test the riskiest assumption</text><circle cx="600" cy="325" r="205" fill="none" stroke="#173a54" stroke-width="56"/><rect x="485" y="120" width="230" height="90" rx="18" fill="#ff8a3d"/><text x="600" y="158" fill="#081b2b" font-size="22" font-weight="700">1 · Hypothesis</text><text x="600" y="185" fill="#081b2b" font-size="16">Eligible users will self-serve</text><rect x="815" y="280" width="230" height="90" rx="18" fill="#65b9ff"/><text x="930" y="318" fill="#081b2b" font-size="22" font-weight="700">2 · Small test</text><text x="930" y="345" fill="#081b2b" font-size="16">One return reason</text><rect x="485" y="440" width="230" height="90" rx="18" fill="#8ee3c5"/><text x="600" y="478" fill="#081b2b" font-size="22" font-weight="700">3 · Measure</text><text x="600" y="505" fill="#081b2b" font-size="16">Completion + support rate</text><rect x="155" y="280" width="230" height="90" rx="18" fill="#d8f4ea"/><text x="270" y="318" fill="#081b2b" font-size="22" font-weight="700">4 · Learn</text><text x="270" y="345" fill="#081b2b" font-size="16">Continue, change, or stop</text><path d="M722 165c120 38 177 83 195 105" fill="none" stroke="#fff" stroke-width="6"/><path d="M905 255l20 24-31-2" fill="#fff"/><path d="M932 380c-50 96-102 135-185 151" fill="none" stroke="#fff" stroke-width="6"/><path d="M757 516l-22 18 29 7" fill="#fff"/><path d="M465 520c-92-22-142-67-176-137" fill="none" stroke="#fff" stroke-width="6"/><path d="M306 389l-24-17 1 30" fill="#fff"/><path d="M273 270c48-72 108-106 185-119" fill="none" stroke="#fff" stroke-width="6"/><path d="M451 139l21 10-18 16" fill="#fff"/></g></svg>
