<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#081b2b"/><g font-family="Arial" text-anchor="middle"><text x="600" y="64" fill="#fff" font-size="34" font-weight="700">Choose a delivery approach from context</text><text x="600" y="105" fill="#cfe8f5" font-size="19">The SDLC exists in every approach; feedback timing changes.</text><rect x="60" y="190" width="320" height="275" rx="22" fill="#173a54" stroke="#65b9ff" stroke-width="3"/><text x="220" y="245" fill="#65b9ff" font-size="28" font-weight="700">Predictive</text><text x="220" y="292" fill="#fff" font-size="20">Stable scope</text><text x="220" y="328" fill="#fff" font-size="20">Formal stage gates</text><text x="220" y="364" fill="#fff" font-size="20">High change cost</text><text x="220" y="421" fill="#cfe8f5" font-size="18">Plan → build → verify</text><rect x="440" y="190" width="320" height="275" rx="22" fill="#173a54" stroke="#8ee3c5" stroke-width="3"/><text x="600" y="245" fill="#8ee3c5" font-size="28" font-weight="700">Adaptive</text><text x="600" y="292" fill="#fff" font-size="20">High uncertainty</text><text x="600" y="328" fill="#fff" font-size="20">Frequent feedback</text><text x="600" y="364" fill="#fff" font-size="20">Small increments</text><text x="600" y="421" fill="#cfe8f5" font-size="18">Learn → deliver → adapt</text><rect x="820" y="190" width="320" height="275" rx="22" fill="#173a54" stroke="#ff8a3d" stroke-width="3"/><text x="980" y="245" fill="#ff8a3d" font-size="28" font-weight="700">Hybrid</text><text x="980" y="292" fill="#fff" font-size="20">Fixed governance</text><text x="980" y="328" fill="#fff" font-size="20">Evolving solution</text><text x="980" y="364" fill="#fff" font-size="20">Mixed checkpoints</text><text x="980" y="421" fill="#cfe8f5" font-size="18">Gate outcomes, iterate detail</text><text x="600" y="540" fill="#fff" font-size="22">Decide using uncertainty, risk, regulation, dependencies, and feedback access.</text></g></svg>
