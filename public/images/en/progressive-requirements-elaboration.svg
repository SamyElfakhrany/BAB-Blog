<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Progressive requirements elaboration</title>
  <desc id="desc">A business outcome develops into stakeholder needs, rules and flows, and testable detail. Evidence and review feed each stage before a delivery-ready slice is agreed.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#17324d" flood-opacity="0.13"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#244968"/></marker>
    <marker id="feedback" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#c76738"/></marker>
  </defs>
  <rect width="1200" height="720" fill="#f7f3ea"/>
  <text x="600" y="62" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#17324d">Elaborate what the next decision needs</text>
  <text x="600" y="96" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#567083">Keep the outcome traceable while evidence increases detail</text>

  <g filter="url(#shadow)">
    <rect x="58" y="154" width="235" height="178" rx="20" fill="#fff1cc" stroke="#e6ae2c" stroke-width="3"/>
    <circle cx="176" cy="154" r="23" fill="#e6ae2c"/><text x="176" y="161" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d">1</text>
    <text x="176" y="202" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#17324d">BUSINESS OUTCOME</text>
    <text x="176" y="244" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4b6478">Problem · value · scope</text>
    <text x="176" y="273" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4b6478">constraints · owner</text>
    <text x="176" y="307" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#9a5f00">Why and for whom?</text>

    <rect x="329" y="154" width="235" height="178" rx="20" fill="#e3effc" stroke="#4c86b8" stroke-width="3"/>
    <circle cx="447" cy="154" r="23" fill="#4c86b8"/><text x="447" y="161" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">2</text>
    <text x="447" y="202" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#17324d">STAKEHOLDER NEEDS</text>
    <text x="447" y="244" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4b6478">Users · operations · policy</text>
    <text x="447" y="273" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4b6478">decisions · exceptions</text>
    <text x="447" y="307" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#2c6596">What do they need?</text>

    <rect x="600" y="154" width="235" height="178" rx="20" fill="#fde7df" stroke="#c76738" stroke-width="3"/>
    <circle cx="718" cy="154" r="23" fill="#c76738"/><text x="718" y="161" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">3</text>
    <text x="718" y="202" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#17324d">RULES &amp; FLOWS</text>
    <text x="718" y="244" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4b6478">States · data · integrations</text>
    <text x="718" y="273" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4b6478">failure paths · ownership</text>
    <text x="718" y="307" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#a44722">How must it behave?</text>

    <rect x="871" y="154" width="271" height="178" rx="20" fill="#e2f4ee" stroke="#3a9b83" stroke-width="3"/>
    <circle cx="1006" cy="154" r="23" fill="#3a9b83"/><text x="1006" y="161" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">4</text>
    <text x="1006" y="202" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#17324d">TESTABLE DETAIL</text>
    <text x="1006" y="244" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4b6478">Examples · quality targets</text>
    <text x="1006" y="273" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4b6478">monitoring · transition</text>
    <text x="1006" y="307" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#23745f">Enough for the next use?</text>
  </g>

  <path d="M293 243 H319" stroke="#244968" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M564 243 H590" stroke="#244968" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M835 243 H861" stroke="#244968" stroke-width="5" marker-end="url(#arrow)"/>

  <path d="M1010 356 C1010 445 870 465 775 419 C680 373 573 391 509 447 C445 503 306 467 306 376" fill="none" stroke="#c76738" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#feedback)"/>
  <rect x="390" y="380" width="420" height="78" rx="18" fill="#ffffff" stroke="#d7cfc0" stroke-width="2"/>
  <text x="600" y="412" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d">EVIDENCE + REVIEW + DECISIONS</text>
  <text x="600" y="440" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#567083">Confirm · correct · split · change · defer</text>

  <g filter="url(#shadow)">
    <rect x="246" y="528" width="708" height="126" rx="25" fill="#173b59"/>
    <text x="600" y="567" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#f4bf45">DELIVERY-READY SLICE</text>
    <text x="600" y="607" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">Traceable outcome · controlled unknowns · agreed evidence</text>
    <text x="600" y="635" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#d8e6ef">Ready for its next decision—not “finished forever”</text>
  </g>
  <path d="M600 458 V516" stroke="#244968" stroke-width="5" marker-end="url(#arrow)"/>
</svg>
