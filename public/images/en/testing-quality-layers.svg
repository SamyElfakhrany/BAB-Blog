<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#081b2b"/><g font-family="Arial" text-anchor="middle"><text x="600" y="64" fill="#fff" font-size="34" font-weight="700">Different tests answer different questions</text><path d="M230 500L420 150H780L970 500Z" fill="#173a54" stroke="#65b9ff" stroke-width="3"/><path d="M315 500L475 215H725L885 500Z" fill="#145172"/><path d="M405 500L525 290H675L795 500Z" fill="#197d8c"/><path d="M495 500L570 365H630L705 500Z" fill="#8ee3c5"/><text x="600" y="190" fill="#fff" font-size="22" font-weight="700">UAT · Does it support real business work?</text><text x="600" y="265" fill="#fff" font-size="21" font-weight="700">System · Does the whole journey behave?</text><text x="600" y="340" fill="#fff" font-size="20" font-weight="700">Integration · Do components exchange correctly?</text><text x="600" y="430" fill="#081b2b" font-size="20" font-weight="700">Unit · Does one component work?</text><path d="M170 545H1030" stroke="#ff8a3d" stroke-width="14"/><text x="600" y="590" fill="#ffb27e" font-size="21" font-weight="700">Regression checks protect behavior across every layer after change.</text></g></svg>
