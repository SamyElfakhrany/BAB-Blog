<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">Design-to-development shared contract</title><desc id="d">Validated intent connects design, reusable components, behavior and states, code, and acceptance evidence.</desc><rect width="1200" height="630" fill="#171335"/><g font-family="Arial" text-anchor="middle"><text x="600" y="70" fill="#fff" font-size="38" font-weight="700">Handoff is a shared contract—not a file drop</text><g font-size="22" font-weight="700"><rect x="70" y="215" width="190" height="130" rx="18" fill="#f7c948"/><text x="165" y="270" fill="#102a43">Intent</text><text x="165" y="307" fill="#102a43" font-size="17" font-weight="400">goal • rule • scope</text><rect x="290" y="215" width="190" height="130" rx="18" fill="#9b8ad9"/><text x="385" y="270" fill="#171335">Design</text><text x="385" y="307" fill="#171335" font-size="17" font-weight="400">flow • states • copy</text><rect x="510" y="215" width="190" height="130" rx="18" fill="#fff"/><text x="605" y="270" fill="#102a43">System</text><text x="605" y="307" fill="#486581" font-size="17" font-weight="400">component • token</text><rect x="730" y="215" width="190" height="130" rx="18" fill="#77a6d3"/><text x="825" y="270" fill="#102a43">Build</text><text x="825" y="307" fill="#102a43" font-size="17" font-weight="400">responsive behavior</text><rect x="950" y="215" width="190" height="130" rx="18" fill="#7dd3a8"/><text x="1045" y="270" fill="#102a43">Accept</text><text x="1045" y="307" fill="#102a43" font-size="17" font-weight="400">evidence • decision</text></g><g stroke="#dcd5ff" stroke-width="7"><path d="M265 280h20M485 280h20M705 280h20M925 280h20"/></g><path d="M1045 375c0 115-880 115-880 0" stroke="#9b8ad9" stroke-width="6" fill="none"/><path d="M180 458l-20 17 25 10" fill="#9b8ad9"/><text x="600" y="535" fill="#dcd5ff" font-size="21">Questions and discoveries loop back before they become expensive defects.</text></g></svg>
