<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Choose a requirements artifact for the decision</title><desc id="desc">A business need flows through four complementary views: document, process, use case, and wireframe, then into a review decision.</desc>
  <rect width="1200" height="630" fill="#081b2b"/><text x="600" y="66" text-anchor="middle" fill="#fff" font-family="Arial" font-size="34" font-weight="700">Choose the artifact for the decision</text>
  <rect x="60" y="245" width="210" height="125" rx="20" fill="#ff8a3d"/><text x="165" y="300" text-anchor="middle" fill="#081b2b" font-family="Arial" font-size="25" font-weight="700">Business need</text><text x="165" y="334" text-anchor="middle" fill="#081b2b" font-family="Arial" font-size="18">Outcome + scope</text>
  <path d="M275 307H340" stroke="#8ee3c5" stroke-width="8"/><path d="M330 294l18 13-18 13" fill="#8ee3c5"/>
  <g font-family="Arial" text-anchor="middle"><rect x="350" y="125" width="210" height="100" rx="16" fill="#173a54" stroke="#8ee3c5" stroke-width="3"/><text x="455" y="170" fill="#fff" font-size="23" font-weight="700">BRD / PRD</text><text x="455" y="200" fill="#cfe8f5" font-size="17">Why and what</text><rect x="350" y="255" width="210" height="100" rx="16" fill="#173a54" stroke="#8ee3c5" stroke-width="3"/><text x="455" y="300" fill="#fff" font-size="23" font-weight="700">Process flow</text><text x="455" y="330" fill="#cfe8f5" font-size="17">Steps and handoffs</text><rect x="350" y="385" width="210" height="100" rx="16" fill="#173a54" stroke="#8ee3c5" stroke-width="3"/><text x="455" y="430" fill="#fff" font-size="23" font-weight="700">Use case</text><text x="455" y="460" fill="#cfe8f5" font-size="17">Behavior + exceptions</text></g>
  <rect x="640" y="245" width="210" height="125" rx="20" fill="#173a54" stroke="#65b9ff" stroke-width="3"/><text x="745" y="300" text-anchor="middle" fill="#fff" font-family="Arial" font-size="25" font-weight="700">Wireframe</text><text x="745" y="334" text-anchor="middle" fill="#cfe8f5" font-family="Arial" font-size="18">Layout + content</text><path d="M565 307H635" stroke="#65b9ff" stroke-width="8"/><path d="M625 294l18 13-18 13" fill="#65b9ff"/>
  <path d="M855 307H920" stroke="#ff8a3d" stroke-width="8"/><path d="M910 294l18 13-18 13" fill="#ff8a3d"/><rect x="930" y="245" width="210" height="125" rx="20" fill="#8ee3c5"/><text x="1035" y="295" text-anchor="middle" fill="#081b2b" font-family="Arial" font-size="24" font-weight="700">Shared decision</text><text x="1035" y="330" text-anchor="middle" fill="#081b2b" font-family="Arial" font-size="18">Review + validate</text>
  <text x="600" y="570" text-anchor="middle" fill="#cfe8f5" font-family="Arial" font-size="21">Use the smallest combination that removes the team’s uncertainty.</text>
</svg>
