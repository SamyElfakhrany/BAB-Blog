<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">حلقة حوكمة الذكاء الاصطناعي المسؤول</title>
  <desc id="desc">حلقة مستمرة تبدأ بالسياق والملكية وتمر بالتأثير والضوابط والدليل والمراقبة والاستجابة.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0d2b45" flood-opacity="0.10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#63809a"/></marker>
  </defs>
  <rect width="1200" height="680" rx="28" fill="#f4f8fb"/>
  <g font-family="Arial, 'Noto Sans Arabic', sans-serif" direction="rtl">
    <text x="600" y="72" text-anchor="middle" font-size="30" font-weight="700" fill="#0d2b45">حوكمة الذكاء الاصطناعي المسؤول حلقة قرار مستمرة</text>
    <text x="600" y="108" text-anchor="middle" font-size="18" fill="#526b82">كل ضابط محتاج مسؤولًا ودليلًا وبوابة قرار واستجابة لما الواقع يتغير.</text>
  </g>

  <g filter="url(#shadow)" font-family="Arial, 'Noto Sans Arabic', sans-serif" direction="rtl">
    <rect x="830" y="160" width="300" height="130" rx="18" fill="#ffffff" stroke="#b8d0e3"/>
    <circle cx="1092" cy="198" r="18" fill="#0d2b45"/><text x="1092" y="204" text-anchor="middle" direction="ltr" font-size="16" font-weight="700" fill="#ffffff">1</text>
    <text x="980" y="204" text-anchor="middle" font-size="20" font-weight="700" fill="#0d2b45">السياق والملكية</text>
    <text x="980" y="242" text-anchor="middle" font-size="16" fill="#526b82">الغرض والنطاق وحقوق القرار</text><text x="980" y="266" text-anchor="middle" font-size="16" fill="#526b82">والحصر ومستوى المخاطر المقبول</text>

    <rect x="450" y="160" width="300" height="130" rx="18" fill="#ffffff" stroke="#b8d0e3"/>
    <circle cx="712" cy="198" r="18" fill="#0d2b45"/><text x="712" y="204" text-anchor="middle" direction="ltr" font-size="16" font-weight="700" fill="#ffffff">2</text>
    <text x="600" y="204" text-anchor="middle" font-size="20" font-weight="700" fill="#0d2b45">التأثير وأصحاب المصلحة</text>
    <text x="600" y="242" text-anchor="middle" font-size="16" fill="#526b82">المنافع والأضرار وسوء الاستخدام</text><text x="600" y="266" text-anchor="middle" font-size="16" fill="#526b82">والأشخاص والعمليات المرتبطة</text>

    <rect x="70" y="160" width="300" height="130" rx="18" fill="#ffffff" stroke="#b8d0e3"/>
    <circle cx="332" cy="198" r="18" fill="#0d2b45"/><text x="332" y="204" text-anchor="middle" direction="ltr" font-size="16" font-weight="700" fill="#ffffff">3</text>
    <text x="220" y="204" text-anchor="middle" font-size="20" font-weight="700" fill="#0d2b45">المتطلبات والضوابط</text>
    <text x="220" y="242" text-anchor="middle" font-size="16" fill="#526b82">امنع واكتشف واستجب واستعد</text><text x="220" y="266" text-anchor="middle" font-size="16" fill="#526b82">وحافظ على بديل صالح</text>

    <rect x="70" y="350" width="300" height="130" rx="18" fill="#ffffff" stroke="#b8d0e3"/>
    <circle cx="332" cy="388" r="18" fill="#0d2b45"/><text x="332" y="394" text-anchor="middle" direction="ltr" font-size="16" font-weight="700" fill="#ffffff">4</text>
    <text x="220" y="394" text-anchor="middle" font-size="20" font-weight="700" fill="#0d2b45">الدليل والموافقة</text>
    <text x="220" y="432" text-anchor="middle" font-size="16" fill="#526b82">الاختبارات والحدود والخطر المتبقي</text><text x="220" y="456" text-anchor="middle" font-size="16" fill="#526b82">وقرار كمّل أو عدّل أو توقّف</text>

    <rect x="450" y="350" width="300" height="130" rx="18" fill="#ffffff" stroke="#b8d0e3"/>
    <circle cx="712" cy="388" r="18" fill="#0d2b45"/><text x="712" y="394" text-anchor="middle" direction="ltr" font-size="16" font-weight="700" fill="#ffffff">5</text>
    <text x="600" y="394" text-anchor="middle" font-size="20" font-weight="700" fill="#0d2b45">المراقبة والاستماع</text>
    <text x="600" y="432" text-anchor="middle" font-size="16" fill="#526b82">الأداء والتأثير والتصحيح والشكاوى</text><text x="600" y="456" text-anchor="middle" font-size="16" fill="#526b82">والحوادث والتغيير</text>

    <rect x="830" y="350" width="300" height="130" rx="18" fill="#ffffff" stroke="#b8d0e3"/>
    <circle cx="1092" cy="388" r="18" fill="#0d2b45"/><text x="1092" y="394" text-anchor="middle" direction="ltr" font-size="16" font-weight="700" fill="#ffffff">6</text>
    <text x="980" y="394" text-anchor="middle" font-size="20" font-weight="700" fill="#0d2b45">الاستجابة والتحسين</text>
    <text x="980" y="432" text-anchor="middle" font-size="16" fill="#526b82">أوقف واحتوِ وصحح وبلّغ وتعلّم</text><text x="980" y="456" text-anchor="middle" font-size="16" fill="#526b82">وأعد التقييم أو انهي الاستخدام</text>
  </g>

  <path d="M830 225 H762" stroke="#63809a" stroke-width="3" marker-end="url(#arrow)"/><path d="M450 225 H382" stroke="#63809a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M220 290 V338" stroke="#63809a" stroke-width="3" marker-end="url(#arrow)"/><path d="M370 415 H438" stroke="#63809a" stroke-width="3" marker-end="url(#arrow)"/><path d="M750 415 H818" stroke="#63809a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1130 415 H1160 V130 H980 V148" fill="none" stroke="#7de2c2" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)" opacity="0.8"/>

  <g font-family="Arial, 'Noto Sans Arabic', sans-serif" direction="rtl">
    <rect x="70" y="545" width="1060" height="82" rx="20" fill="#0d2b45"/>
    <text x="600" y="578" text-anchor="middle" font-size="17" font-weight="700" fill="#7de2c2">سجل الحوكمة</text>
    <text x="600" y="607" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">مين قرر إيه، بأنهي دليل، داخل أنهي حدود—وإيه الخطوة التالية؟</text>
  </g>
</svg>
