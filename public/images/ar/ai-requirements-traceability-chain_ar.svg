<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">سلسلة تتبع متطلبات الذكاء الاصطناعي</title>
  <desc id="desc">ست خطوات مترابطة من حاجة العمل والسياق حتى الإطلاق والمراقبة.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07152d"/><stop offset="1" stop-color="#142f4d"/></linearGradient>
    <linearGradient id="accent" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#020617" flood-opacity=".34"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5eead4"/></marker>
  </defs>
  <rect width="1200" height="700" rx="34" fill="url(#bg)"/>
  <circle cx="1095" cy="80" r="145" fill="#2563eb" opacity=".10"/><circle cx="95" cy="630" r="180" fill="#14b8a6" opacity=".08"/>
  <text x="600" y="72" fill="#f8fafc" font-family="Arial, Tahoma, sans-serif" font-size="34" font-weight="700" text-anchor="middle" direction="rtl">سلسلة تتبع متطلبات الذكاء الاصطناعي</text>
  <text x="600" y="108" fill="#b9ccdf" font-family="Arial, Tahoma, sans-serif" font-size="18" text-anchor="middle" direction="rtl">حوّل الفكرة الواعدة إلى دليل يدعم قرارًا مسؤولًا.</text>

  <g fill="none" stroke="#5eead4" stroke-width="4" opacity=".82" marker-end="url(#arrow)">
    <path d="M835 229 H769"/><path d="M432 229 H366"/><path d="M205 314 V374"/><path d="M365 465 H431"/><path d="M768 465 H834"/>
  </g>

  <g filter="url(#shadow)" font-family="Arial, Tahoma, sans-serif">
    <g transform="translate(835 145)">
      <rect width="300" height="168" rx="22" fill="#102a43" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="262" cy="38" r="22" fill="#0ea5e9"/><text x="262" y="45" fill="white" font-size="20" font-weight="700" text-anchor="middle">١</text>
      <text x="132" y="44" fill="#f8fafc" font-size="22" font-weight="700" text-anchor="middle" direction="rtl">الحاجة والسياق</text>
      <text x="150" y="84" fill="#cbd5e1" font-size="17" text-anchor="middle" direction="rtl"><tspan x="150">النتيجة والمستخدمون والمتأثرون</tspan><tspan x="150" dy="26">والعملية الحالية والقرار.</tspan></text>
      <rect x="84" y="132" width="192" height="23" rx="11" fill="#0e7490" opacity=".55"/><text x="180" y="149" fill="#e0f2fe" font-size="13" text-anchor="middle" direction="rtl">لماذا نحتاج هذا النظام؟</text>
    </g>
    <g transform="translate(432 145)">
      <rect width="336" height="168" rx="22" fill="#102a43" stroke="#2dd4bf" stroke-width="2"/>
      <circle cx="298" cy="38" r="22" fill="#14b8a6"/><text x="298" y="45" fill="white" font-size="20" font-weight="700" text-anchor="middle">٢</text>
      <text x="150" y="44" fill="#f8fafc" font-size="22" font-weight="700" text-anchor="middle" direction="rtl">النطاق والسلوك</text>
      <text x="168" y="84" fill="#cbd5e1" font-size="17" text-anchor="middle" direction="rtl"><tspan x="168">المدخلات والمخرجات والصلاحيات</tspan><tspan x="168" dy="26">والحدود وسير العمل والبديل.</tspan></text>
      <rect x="88" y="132" width="224" height="23" rx="11" fill="#0f766e" opacity=".55"/><text x="200" y="149" fill="#ccfbf1" font-size="13" text-anchor="middle" direction="rtl">ماذا يُسمح للنظام أن يفعل؟</text>
    </g>
    <g transform="translate(65 145)">
      <rect width="300" height="168" rx="22" fill="#102a43" stroke="#818cf8" stroke-width="2"/>
      <circle cx="262" cy="38" r="22" fill="#6366f1"/><text x="262" y="45" fill="white" font-size="20" font-weight="700" text-anchor="middle">٣</text>
      <text x="132" y="44" fill="#f8fafc" font-size="22" font-weight="700" text-anchor="middle" direction="rtl">الجودة والضوابط</text>
      <text x="150" y="84" fill="#cbd5e1" font-size="17" text-anchor="middle" direction="rtl"><tspan x="150">المقاييس والتقسيمات والبيانات</tspan><tspan x="150" dy="26">والإشراف والأمان والحدود.</tspan></text>
      <rect x="91" y="132" width="185" height="23" rx="11" fill="#4338ca" opacity=".55"/><text x="184" y="149" fill="#e0e7ff" font-size="13" text-anchor="middle" direction="rtl">ما مستوى الجودة الكافي؟</text>
    </g>
    <g transform="translate(65 382)">
      <rect width="300" height="168" rx="22" fill="#102a43" stroke="#f59e0b" stroke-width="2"/>
      <circle cx="262" cy="38" r="22" fill="#d97706"/><text x="262" y="45" fill="white" font-size="20" font-weight="700" text-anchor="middle">٤</text>
      <text x="132" y="44" fill="#f8fafc" font-size="20" font-weight="700" text-anchor="middle" direction="rtl">السيناريوهات والتقييم</text>
      <text x="150" y="84" fill="#cbd5e1" font-size="17" text-anchor="middle" direction="rtl"><tspan x="150">المسارات الطبيعية والحدود والفشل</tspan><tspan x="150" dy="26">وسوء الاستخدام والحالات الممثلة.</tspan></text>
      <rect x="95" y="132" width="181" height="23" rx="11" fill="#b45309" opacity=".55"/><text x="186" y="149" fill="#fef3c7" font-size="13" text-anchor="middle" direction="rtl">كيف سنختبر النظام؟</text>
    </g>
    <g transform="translate(432 382)">
      <rect width="336" height="168" rx="22" fill="#102a43" stroke="#f472b6" stroke-width="2"/>
      <circle cx="298" cy="38" r="22" fill="#db2777"/><text x="298" y="45" fill="white" font-size="20" font-weight="700" text-anchor="middle">٥</text>
      <text x="150" y="44" fill="#f8fafc" font-size="22" font-weight="700" text-anchor="middle" direction="rtl">الدليل والمسؤولية</text>
      <text x="168" y="84" fill="#cbd5e1" font-size="17" text-anchor="middle" direction="rtl"><tspan x="168">مجموعة الاختبار والنتيجة والقيود</tspan><tspan x="168" dy="26">والمالك وسجل القرار.</tspan></text>
      <rect x="82" y="132" width="230" height="23" rx="11" fill="#9d174d" opacity=".55"/><text x="197" y="149" fill="#fce7f3" font-size="13" text-anchor="middle" direction="rtl">ما الدليل على تحقق المتطلب؟</text>
    </g>
    <g transform="translate(835 382)">
      <rect width="300" height="168" rx="22" fill="#102a43" stroke="#4ade80" stroke-width="2"/>
      <circle cx="262" cy="38" r="22" fill="#16a34a"/><text x="262" y="45" fill="white" font-size="20" font-weight="700" text-anchor="middle">٦</text>
      <text x="132" y="44" fill="#f8fafc" font-size="22" font-weight="700" text-anchor="middle" direction="rtl">الإطلاق والمراقبة</text>
      <text x="150" y="84" fill="#cbd5e1" font-size="17" text-anchor="middle" direction="rtl"><tspan x="150">أطلق أو عدّل أو أوقف، ثم راقب</tspan><tspan x="150" dy="26">القيمة والخطر وتغير الأداء.</tspan></text>
      <rect x="84" y="132" width="192" height="23" rx="11" fill="#15803d" opacity=".55"/><text x="180" y="149" fill="#dcfce7" font-size="13" text-anchor="middle" direction="rtl">ماذا سيحدث بعد ذلك؟</text>
    </g>
  </g>

  <rect x="65" y="598" width="1070" height="57" rx="18" fill="url(#accent)" opacity=".16" stroke="#5eead4" stroke-width="1.5"/>
  <text x="600" y="634" fill="#e6fffb" font-family="Arial, Tahoma, sans-serif" font-size="18" font-weight="700" text-anchor="middle" direction="rtl">احتفظ بسجل واحد قابل للتتبع: الحاجة ← الخطر ← المتطلب ← الاختبار ← الدليل ← القرار</text>
</svg>
