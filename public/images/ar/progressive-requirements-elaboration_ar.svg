<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">التفصيل التدريجي للمتطلبات</title>
  <desc id="desc">تتطور نتيجة العمل إلى احتياجات أصحاب المصلحة ثم القواعد والتدفقات ثم التفاصيل القابلة للاختبار، وتغذي الأدلة والمراجعة كل مرحلة قبل الاتفاق على شريحة جاهزة للتسليم.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#17324d" flood-opacity="0.13"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#244968"/></marker>
    <marker id="feedback" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#c76738"/></marker>
  </defs>
  <rect width="1200" height="720" fill="#f7f3ea"/>
  <text x="600" y="62" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="30" font-weight="700" fill="#17324d">فصّل بالمقدار الذي يحتاجه القرار التالي</text>
  <text x="600" y="96" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="17" fill="#567083">حافظ على تتبع النتيجة مع زيادة التفاصيل بالأدلة</text>

  <g filter="url(#shadow)">
    <rect x="907" y="154" width="235" height="178" rx="20" fill="#fff1cc" stroke="#e6ae2c" stroke-width="3"/>
    <circle cx="1025" cy="154" r="23" fill="#e6ae2c"/><text x="1025" y="161" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d">١</text>
    <text x="1025" y="202" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="22" font-weight="700" fill="#17324d">نتيجة العمل</text>
    <text x="1025" y="244" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="16" fill="#4b6478">المشكلة · القيمة · النطاق</text>
    <text x="1025" y="273" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="16" fill="#4b6478">القيود · صاحب القرار</text>
    <text x="1025" y="307" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="15" font-weight="700" fill="#9a5f00">لماذا ولمَن؟</text>

    <rect x="636" y="154" width="235" height="178" rx="20" fill="#e3effc" stroke="#4c86b8" stroke-width="3"/>
    <circle cx="754" cy="154" r="23" fill="#4c86b8"/><text x="754" y="161" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">٢</text>
    <text x="754" y="202" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="21" font-weight="700" fill="#17324d">احتياجات أصحاب المصلحة</text>
    <text x="754" y="244" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="16" fill="#4b6478">المستخدم · التشغيل · السياسة</text>
    <text x="754" y="273" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="16" fill="#4b6478">القرارات · الاستثناءات</text>
    <text x="754" y="307" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="15" font-weight="700" fill="#2c6596">إيه اللي محتاجينه؟</text>

    <rect x="365" y="154" width="235" height="178" rx="20" fill="#fde7df" stroke="#c76738" stroke-width="3"/>
    <circle cx="483" cy="154" r="23" fill="#c76738"/><text x="483" y="161" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">٣</text>
    <text x="483" y="202" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="22" font-weight="700" fill="#17324d">القواعد والتدفقات</text>
    <text x="483" y="244" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="16" fill="#4b6478">حالات · بيانات · تكاملات</text>
    <text x="483" y="273" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="16" fill="#4b6478">فشل · مسؤوليات</text>
    <text x="483" y="307" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="15" font-weight="700" fill="#a44722">إزاي لازم يتصرف؟</text>

    <rect x="58" y="154" width="271" height="178" rx="20" fill="#e2f4ee" stroke="#3a9b83" stroke-width="3"/>
    <circle cx="194" cy="154" r="23" fill="#3a9b83"/><text x="194" y="161" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">٤</text>
    <text x="194" y="202" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="22" font-weight="700" fill="#17324d">تفاصيل قابلة للاختبار</text>
    <text x="194" y="244" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="16" fill="#4b6478">أمثلة · أهداف جودة</text>
    <text x="194" y="273" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="16" fill="#4b6478">مراقبة · انتقال</text>
    <text x="194" y="307" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="15" font-weight="700" fill="#23745f">كفاية للاستخدام التالي؟</text>
  </g>

  <path d="M907 243 H881" stroke="#244968" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M636 243 H610" stroke="#244968" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M365 243 H339" stroke="#244968" stroke-width="5" marker-end="url(#arrow)"/>

  <path d="M190 356 C190 445 330 465 425 419 C520 373 627 391 691 447 C755 503 894 467 894 376" fill="none" stroke="#c76738" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#feedback)"/>
  <rect x="390" y="380" width="420" height="78" rx="18" fill="#ffffff" stroke="#d7cfc0" stroke-width="2"/>
  <text x="600" y="412" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d">أدلة + مراجعة + قرارات</text>
  <text x="600" y="440" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="15" fill="#567083">أكد · صحح · اقسم · غيّر · أجّل</text>

  <g filter="url(#shadow)">
    <rect x="246" y="528" width="708" height="126" rx="25" fill="#173b59"/>
    <text x="600" y="567" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="15" font-weight="700" fill="#f4bf45">شريحة جاهزة للتسليم</text>
    <text x="600" y="607" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">نتيجة قابلة للتتبع · مجهول مضبوط · دليل متفق عليه</text>
    <text x="600" y="635" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="15" fill="#d8e6ef">جاهزة للقرار التالي، مش «مكتملة للأبد»</text>
  </g>
  <path d="M600 458 V516" stroke="#244968" stroke-width="5" marker-end="url(#arrow)"/>
</svg>
