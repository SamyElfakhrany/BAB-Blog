<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">ست بوابات لتقييم جاهزية البيانات للذكاء الاصطناعي</title>
  <desc id="desc">مسار يبدأ بالغرض والمصدر ثم الجودة والتغطية والسماح والتقييم وينتهي بقرار الجاهزية.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0d2b45" flood-opacity="0.10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#63809a"/></marker>
  </defs>
  <rect width="1200" height="680" rx="28" fill="#f4f8fb"/>
  <g font-family="Arial, 'Noto Sans Arabic', sans-serif" direction="rtl">
    <text x="600" y="72" text-anchor="middle" font-size="30" font-weight="700" fill="#0d2b45">جاهزية البيانات قرار، مش مجرد درجة نظافة</text>
    <text x="600" y="108" text-anchor="middle" font-size="18" fill="#526b82">كمّل فقط لما الدليل يناسب استخدام الذكاء الاصطناعي وسياق التشغيل.</text>
  </g>

  <g filter="url(#shadow)" font-family="Arial, 'Noto Sans Arabic', sans-serif" direction="rtl">
    <rect x="830" y="160" width="300" height="130" rx="18" fill="#ffffff" stroke="#b8d0e3"/>
    <circle cx="1092" cy="198" r="18" fill="#0d2b45"/><text x="1092" y="204" text-anchor="middle" direction="ltr" font-size="16" font-weight="700" fill="#ffffff">1</text>
    <text x="980" y="204" text-anchor="middle" font-size="21" font-weight="700" fill="#0d2b45">الغرض</text>
    <text x="980" y="242" text-anchor="middle" font-size="16" fill="#526b82">أنهي قرار، ومستخدمين، ونطاق،</text><text x="980" y="266" text-anchor="middle" font-size="16" fill="#526b82">ونتيجة مطلوبة؟</text>

    <rect x="450" y="160" width="300" height="130" rx="18" fill="#ffffff" stroke="#b8d0e3"/>
    <circle cx="712" cy="198" r="18" fill="#0d2b45"/><text x="712" y="204" text-anchor="middle" direction="ltr" font-size="16" font-weight="700" fill="#ffffff">2</text>
    <text x="600" y="204" text-anchor="middle" font-size="21" font-weight="700" fill="#0d2b45">المصدر</text>
    <text x="600" y="242" text-anchor="middle" font-size="16" fill="#526b82">كل حقل جه منين، واتجمع إزاي،</text><text x="600" y="266" text-anchor="middle" font-size="16" fill="#526b82">وإيه التحويلات اللي حصلت له؟</text>

    <rect x="70" y="160" width="300" height="130" rx="18" fill="#ffffff" stroke="#b8d0e3"/>
    <circle cx="332" cy="198" r="18" fill="#0d2b45"/><text x="332" y="204" text-anchor="middle" direction="ltr" font-size="16" font-weight="700" fill="#ffffff">3</text>
    <text x="220" y="204" text-anchor="middle" font-size="21" font-weight="700" fill="#0d2b45">الجودة</text>
    <text x="220" y="242" text-anchor="middle" font-size="16" fill="#526b82">القيم مكتملة وصحيحة ومتسقة</text><text x="220" y="266" text-anchor="middle" font-size="16" fill="#526b82">ومميزة وحديثة؟</text>

    <rect x="70" y="350" width="300" height="130" rx="18" fill="#ffffff" stroke="#b8d0e3"/>
    <circle cx="332" cy="388" r="18" fill="#0d2b45"/><text x="332" y="394" text-anchor="middle" direction="ltr" font-size="16" font-weight="700" fill="#ffffff">4</text>
    <text x="220" y="394" text-anchor="middle" font-size="21" font-weight="700" fill="#0d2b45">التغطية</text>
    <text x="220" y="432" text-anchor="middle" font-size="16" fill="#526b82">العينة بتمثل المستخدمين والحالات</text><text x="220" y="456" text-anchor="middle" font-size="16" fill="#526b82">والاستثناءات الحقيقية؟</text>

    <rect x="450" y="350" width="300" height="130" rx="18" fill="#ffffff" stroke="#b8d0e3"/>
    <circle cx="712" cy="388" r="18" fill="#0d2b45"/><text x="712" y="394" text-anchor="middle" direction="ltr" font-size="16" font-weight="700" fill="#ffffff">5</text>
    <text x="600" y="394" text-anchor="middle" font-size="21" font-weight="700" fill="#0d2b45">السماح</text>
    <text x="600" y="432" text-anchor="middle" font-size="16" fill="#526b82">الاستخدام مسموح وضروري ومحمي،</text><text x="600" y="456" text-anchor="middle" font-size="16" fill="#526b82">وله مسؤول واضح؟</text>

    <rect x="830" y="350" width="300" height="130" rx="18" fill="#ffffff" stroke="#b8d0e3"/>
    <circle cx="1092" cy="388" r="18" fill="#0d2b45"/><text x="1092" y="394" text-anchor="middle" direction="ltr" font-size="16" font-weight="700" fill="#ffffff">6</text>
    <text x="980" y="394" text-anchor="middle" font-size="21" font-weight="700" fill="#0d2b45">التقييم</text>
    <text x="980" y="432" text-anchor="middle" font-size="16" fill="#526b82">نقدر نفصل ونختبر ونراقب</text><text x="980" y="456" text-anchor="middle" font-size="16" fill="#526b82">ونكرر الدليل؟</text>
  </g>

  <path d="M830 225 H762" stroke="#63809a" stroke-width="3" marker-end="url(#arrow)"/><path d="M450 225 H382" stroke="#63809a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M220 290 V338" stroke="#63809a" stroke-width="3" marker-end="url(#arrow)"/><path d="M370 415 H438" stroke="#63809a" stroke-width="3" marker-end="url(#arrow)"/><path d="M750 415 H818" stroke="#63809a" stroke-width="3" marker-end="url(#arrow)"/>

  <g font-family="Arial, 'Noto Sans Arabic', sans-serif" direction="rtl">
    <rect x="70" y="545" width="1060" height="82" rx="20" fill="#0d2b45"/>
    <text x="600" y="578" text-anchor="middle" font-size="17" font-weight="700" fill="#7de2c2">قرار الجاهزية</text>
    <text x="600" y="607" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">كمّل  •  أصلح  •  ضيّق النطاق  •  اجمع دليل  •  توقّف</text>
  </g>
</svg>
