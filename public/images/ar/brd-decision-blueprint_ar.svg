<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">خريطة قرار مستند متطلبات العمل</title>
  <desc id="desc">تنتقل الـBRD من احتياج العمل ودليله إلى النتائج والنطاق والمتطلبات والمراجعة حتى القرار المعتمد، وتربط سلسلة التتبع الاحتياج بدليل التحقق.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#17324d" flood-opacity="0.14"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#244968"/></marker>
  </defs>
  <rect width="1200" height="720" fill="#f7f3ea"/>
  <text x="600" y="58" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="30" font-weight="700" fill="#17324d">الـBRD طريق لاتخاذ قرار، مش مخزن مستندات</text>
  <text x="600" y="91" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="17" fill="#567083">اربط الدليل والحدود والمتطلبات وسلطة القرار</text>

  <g filter="url(#shadow)">
    <rect x="956" y="145" width="202" height="190" rx="20" fill="#fff1cc" stroke="#e3ad2f" stroke-width="3"/>
    <circle cx="1057" cy="145" r="24" fill="#e3ad2f"/><text x="1057" y="153" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d">١</text>
    <text x="1057" y="198" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="21" font-weight="700" fill="#17324d">الاحتياج والدليل</text>
    <text x="1057" y="237" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="15" fill="#4b6478">مشكلة · فرصة</text>
    <text x="1057" y="264" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="15" fill="#4b6478">خط الأساس · المتأثرون</text>
    <text x="1057" y="304" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="15" font-weight="700" fill="#956000">ليه نغيّر؟</text>

    <rect x="728" y="145" width="202" height="190" rx="20" fill="#e3effc" stroke="#4c86b8" stroke-width="3"/>
    <circle cx="829" cy="145" r="24" fill="#4c86b8"/><text x="829" y="153" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">٢</text>
    <text x="829" y="198" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="21" font-weight="700" fill="#17324d">النتائج</text>
    <text x="829" y="237" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="15" fill="#4b6478">أهداف · مقاييس</text>
    <text x="829" y="264" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="15" fill="#4b6478">مستهدفات · ملاك</text>
    <text x="829" y="304" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="15" font-weight="700" fill="#2c6596">إيه القيمة؟</text>

    <rect x="500" y="145" width="202" height="190" rx="20" fill="#f1e7fa" stroke="#8a66a6" stroke-width="3"/>
    <circle cx="601" cy="145" r="24" fill="#8a66a6"/><text x="601" y="153" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">٣</text>
    <text x="601" y="198" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="21" font-weight="700" fill="#17324d">الحدود</text>
    <text x="601" y="237" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="15" fill="#4b6478">نطاق · أصحاب مصلحة</text>
    <text x="601" y="264" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="15" fill="#4b6478">سياق · قرارات</text>
    <text x="601" y="304" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="15" font-weight="700" fill="#6e4a8a">فين ومين؟</text>

    <rect x="272" y="145" width="202" height="190" rx="20" fill="#fde7df" stroke="#c76738" stroke-width="3"/>
    <circle cx="373" cy="145" r="24" fill="#c76738"/><text x="373" y="153" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">٤</text>
    <text x="373" y="198" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="21" font-weight="700" fill="#17324d">المتطلبات</text>
    <text x="373" y="237" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="15" fill="#4b6478">قواعد · جودة · مخاطر</text>
    <text x="373" y="264" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="15" fill="#4b6478">استثناءات · انتقال</text>
    <text x="373" y="304" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="15" font-weight="700" fill="#a44722">إيه اللي لازم يتحقق؟</text>

    <rect x="42" y="145" width="204" height="190" rx="20" fill="#e2f4ee" stroke="#3a9b83" stroke-width="3"/>
    <circle cx="144" cy="145" r="24" fill="#3a9b83"/><text x="144" y="153" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">٥</text>
    <text x="144" y="198" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d">المراجعة والاعتماد</text>
    <text x="144" y="237" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="15" fill="#4b6478">تحقق وتصديق · شروط</text>
    <text x="144" y="264" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="15" fill="#4b6478">سلطة · خط أساس</text>
    <text x="144" y="304" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="15" font-weight="700" fill="#23745f">إيه القرار؟</text>
  </g>

  <path d="M956 240 H940" stroke="#244968" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M728 240 H712" stroke="#244968" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M500 240 H484" stroke="#244968" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M272 240 H256" stroke="#244968" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="94" y="408" width="1012" height="184" rx="26" fill="#173b59" filter="url(#shadow)"/>
  <text x="600" y="448" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="16" font-weight="700" fill="#f4bf45">سلسلة التتبع</text>
  <g font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">
    <text x="1010" y="505">احتياج العمل</text>
    <text x="805" y="505">متطلب عمل</text>
    <text x="600" y="505">متطلب صاحب مصلحة</text>
    <text x="395" y="505">متطلب حل أو انتقال</text>
    <text x="190" y="505">الأدلة والمقاييس</text>
  </g>
  <g stroke="#77c9b5" stroke-width="4" marker-end="url(#arrow)">
    <path d="M930 500 H885"/><path d="M725 500 H680"/><path d="M520 500 H475"/><path d="M315 500 H270"/>
  </g>
  <text x="600" y="557" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="16" fill="#d8e6ef">كل متطلب له سبب ومالك وعلاقة وطريقة للتصديق عليه</text>
  <rect x="260" y="628" width="680" height="54" rx="27" fill="#ffffff" stroke="#cfc6b7" stroke-width="2"/>
  <text x="600" y="662" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d">مستند أساسي مختصر + تفاصيل مرتبطة ومحدّثة</text>
</svg>
