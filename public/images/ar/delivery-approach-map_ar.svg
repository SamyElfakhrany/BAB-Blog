<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#081b2b"/><g font-family="Arial" direction="rtl" text-anchor="middle"><text x="600" y="64" fill="#fff" font-size="34" font-weight="700">اختار أسلوب التسليم من سياق المشروع</text><text x="600" y="105" fill="#cfe8f5" font-size="19">دورة حياة البرمجيات موجودة دائمًا؛ الاختلاف في توقيت التعلّم.</text><rect x="60" y="190" width="320" height="275" rx="22" fill="#173a54" stroke="#65b9ff" stroke-width="3"/><text x="220" y="245" fill="#65b9ff" font-size="28" font-weight="700">تنبؤي</text><text x="220" y="292" fill="#fff" font-size="20">نطاق ثابت</text><text x="220" y="328" fill="#fff" font-size="20">بوابات رسمية</text><text x="220" y="364" fill="#fff" font-size="20">تكلفة تغيير عالية</text><text x="220" y="421" fill="#cfe8f5" font-size="18">خطط ← نفّذ ← تحقق</text><rect x="440" y="190" width="320" height="275" rx="22" fill="#173a54" stroke="#8ee3c5" stroke-width="3"/><text x="600" y="245" fill="#8ee3c5" font-size="28" font-weight="700">تكيفي</text><text x="600" y="292" fill="#fff" font-size="20">عدم يقين مرتفع</text><text x="600" y="328" fill="#fff" font-size="20">Feedback متكرر</text><text x="600" y="364" fill="#fff" font-size="20">زيادات صغيرة</text><text x="600" y="421" fill="#cfe8f5" font-size="18">اتعلّم ← سلّم ← عدّل</text><rect x="820" y="190" width="320" height="275" rx="22" fill="#173a54" stroke="#ff8a3d" stroke-width="3"/><text x="980" y="245" fill="#ff8a3d" font-size="28" font-weight="700">هجين</text><text x="980" y="292" fill="#fff" font-size="20">حوكمة ثابتة</text><text x="980" y="328" fill="#fff" font-size="20">حل بيتطور</text><text x="980" y="364" fill="#fff" font-size="20">نقاط مراجعة مختلطة</text><text x="980" y="421" fill="#cfe8f5" font-size="18">ثبّت النتائج وكرّر التفاصيل</text><text x="600" y="540" fill="#fff" font-size="22">القرار يعتمد على عدم اليقين والمخاطر والتنظيم والاعتماديات وسهولة الوصول للمستخدم.</text></g></svg>
