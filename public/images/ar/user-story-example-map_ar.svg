<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#081b2b"/><g font-family="Arial" direction="rtl" text-anchor="middle"><text x="600" y="65" fill="#fff" font-size="34" font-weight="700">قصة المستخدم محادثة مثبتة بأمثلة</text><rect x="880" y="185" width="250" height="250" rx="20" fill="#ff8a3d"/><text x="1005" y="240" fill="#081b2b" font-size="25" font-weight="700">نتيجة المستخدم</text><text x="1005" y="292" fill="#081b2b" font-size="18">يبدأ إرجاعًا مؤهلًا</text><text x="1005" y="326" fill="#081b2b" font-size="18">من غير الاتصال بالدعم</text><rect x="475" y="145" width="250" height="330" rx="20" fill="#173a54" stroke="#8ee3c5" stroke-width="3"/><text x="600" y="205" fill="#8ee3c5" font-size="25" font-weight="700">القصة والمحادثة</text><text x="600" y="262" fill="#fff" font-size="18">مين محتاج إيه؟</text><text x="600" y="302" fill="#fff" font-size="18">ليه ده مهم؟</text><text x="600" y="342" fill="#fff" font-size="18">إيه القواعد والمخاطر؟</text><text x="600" y="382" fill="#fff" font-size="18">إيه أصغر جزء مفيد؟</text><rect x="70" y="185" width="250" height="250" rx="20" fill="#65b9ff"/><text x="195" y="240" fill="#081b2b" font-size="25" font-weight="700">التأكيد</text><text x="195" y="292" fill="#081b2b" font-size="18">Given: السياق</text><text x="195" y="326" fill="#081b2b" font-size="18">When: الفعل</text><text x="195" y="360" fill="#081b2b" font-size="18">Then: نتيجة قابلة للملاحظة</text><text x="600" y="555" fill="#cfe8f5" font-size="21">الكارت يبدأ النقاش؛ وأمثلة القبول تجعل الحدود قابلة للاختبار.</text></g><path d="M870 310H740" stroke="#8ee3c5" stroke-width="8"/><path d="M750 297l-18 13 18 13" fill="#8ee3c5"/><path d="M465 310H335" stroke="#65b9ff" stroke-width="8"/><path d="M345 297l-18 13 18 13" fill="#65b9ff"/></svg>
