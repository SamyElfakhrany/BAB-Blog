<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">مصفوفة حالات الواجهة الكاملة</title><desc id="d">إجراء الإرجاع محدد عبر الحالات الافتراضية والتحميل والنجاح والفراغ والخطأ والتعطيل وعلى أجهزة مختلفة.</desc><rect width="1200" height="630" fill="#f7f9fb"/><g font-family="Arial" text-anchor="middle" direction="rtl"><text x="600" y="65" fill="#102a43" font-size="38" font-weight="700">الشاشة مجموعة حالات، مش صورة واحدة</text><g font-size="20" font-weight="700"><rect x="980" y="145" width="170" height="115" rx="16" fill="#fff" stroke="#77a6d3" stroke-width="3"/><text x="1065" y="198" fill="#102a43">Default</text><text x="1065" y="228" fill="#486581" font-size="16" font-weight="400">الإجراء متاح</text><rect x="795" y="145" width="170" height="115" rx="16" fill="#fff" stroke="#f7c948" stroke-width="3"/><text x="880" y="198" fill="#102a43">Loading</text><text x="880" y="228" fill="#486581" font-size="16" font-weight="400">تقدم بلا تكرار</text><rect x="610" y="145" width="170" height="115" rx="16" fill="#fff" stroke="#7dd3a8" stroke-width="3"/><text x="695" y="198" fill="#102a43">نجاح</text><text x="695" y="228" fill="#486581" font-size="16" font-weight="400">مرجع وخطوة تالية</text><rect x="425" y="145" width="170" height="115" rx="16" fill="#fff" stroke="#d9e2ec" stroke-width="3"/><text x="510" y="198" fill="#102a43">فارغ</text><text x="510" y="228" fill="#486581" font-size="16" font-weight="400">سبب وبديل</text><rect x="240" y="145" width="170" height="115" rx="16" fill="#fff" stroke="#f39c6b" stroke-width="3"/><text x="325" y="198" fill="#102a43">خطأ</text><text x="325" y="228" fill="#486581" font-size="16" font-weight="400">سبب وطريقة إصلاح</text><rect x="55" y="145" width="170" height="115" rx="16" fill="#fff" stroke="#9b8ad9" stroke-width="3"/><text x="140" y="198" fill="#102a43">Disabled</text><text x="140" y="228" fill="#486581" font-size="16" font-weight="400">سبب واضح</text></g><g font-size="22" font-weight="700"><rect x="800" y="345" width="260" height="95" rx="18" fill="#40366f"/><text x="930" y="402" fill="#fff">موبايل ولمس</text><rect x="470" y="345" width="260" height="95" rx="18" fill="#40366f"/><text x="600" y="402" fill="#fff">كمبيوتر وكيبورد</text><rect x="140" y="345" width="260" height="95" rx="18" fill="#40366f"/><text x="270" y="402" fill="#fff">قارئ شاشة</text></g><text x="600" y="515" fill="#102a43" font-size="24" font-weight="700">تحقق من الترتيب والتباين والتركيز والقراءة والتعافي في كل حالة.</text></g></svg>
