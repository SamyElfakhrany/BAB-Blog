<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">الدليل يتحول لفهم للمنتج</title><desc id="d">ملاحظات البحث تتحول لشخصية وتعاطف ورحلة مستخدم ثم فرص قابلة للاختبار.</desc><rect width="1200" height="630" fill="#151b2b"/><g font-family="Arial" text-anchor="middle" direction="rtl"><text x="600" y="70" fill="#fff" font-size="38" font-weight="700">التجميع سلسلة مرتبطة بالدليل</text><g font-size="23" font-weight="700"><rect x="965" y="220" width="190" height="145" rx="20" fill="#77a6d3"/><text x="1060" y="275" fill="#102a43">بحث</text><text x="1060" y="311" font-size="17" font-weight="400" fill="#102a43">كلام • أفعال</text><text x="1060" y="338" font-size="17" font-weight="400" fill="#102a43">بيانات • سياق</text><rect x="735" y="220" width="190" height="145" rx="20" fill="#fff"/><text x="830" y="275" fill="#102a43">Persona</text><text x="830" y="311" font-size="17" font-weight="400" fill="#486581">أهداف • سلوك</text><text x="830" y="338" font-size="17" font-weight="400" fill="#486581">قيود</text><rect x="505" y="220" width="190" height="145" rx="20" fill="#f7c948"/><text x="600" y="275" fill="#102a43">Empathy Map</text><text x="600" y="311" font-size="17" font-weight="400" fill="#102a43">بيقول • بيعمل</text><text x="600" y="338" font-size="17" font-weight="400" fill="#102a43">بيفكر • بيحس</text><rect x="275" y="220" width="190" height="145" rx="20" fill="#9b8ad9"/><text x="370" y="275" fill="#171335">رحلة</text><text x="370" y="311" font-size="17" font-weight="400" fill="#171335">خطوات • نقاط تواصل</text><text x="370" y="338" font-size="17" font-weight="400" fill="#171335">مشكلات</text><rect x="45" y="220" width="190" height="145" rx="20" fill="#7dd3a8"/><text x="140" y="275" fill="#102a43">فرصة</text><text x="140" y="311" font-size="17" font-weight="400" fill="#102a43">سؤال • مسؤول</text><text x="140" y="338" font-size="17" font-weight="400" fill="#102a43">مقياس</text></g><g stroke="#dcd5ff" stroke-width="7"><path d="M960 292h-30M730 292h-30M500 292h-30M270 292h-30"/></g><text x="600" y="485" fill="#fff" font-size="26" font-weight="700">كل جملة لازم ترجع لدليل تم ملاحظته.</text><text x="600" y="525" fill="#c5ccdb" font-size="20">المجهول يفضل افتراضًا، مش حقيقة عن «المستخدم».</text></g></svg>
