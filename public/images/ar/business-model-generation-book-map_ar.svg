    <circle cx="379" cy="492" r="61" fill="#f4f1e8" stroke="#20242a" stroke-width="3"/><text x="379" y="498">التنفيذ</text>
    <circle cx="600" cy="492" r="61" fill="#f4f1e8" stroke="#20242a" stroke-width="3"/><text x="600" y="498">التصميم</text>
    <circle cx="821" cy="492" r="61" fill="#f4f1e8" stroke="#20242a" stroke-width="3"/><text x="821" y="498">الفهم</text>
    <circle cx="1042" cy="492" r="61" fill="#f4f1e8" stroke="#20242a" stroke-width="3"/><text x="1042" y="498">الحشد</text>
