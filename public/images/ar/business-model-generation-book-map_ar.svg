<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">خريطة كتاب ابتكار نموذج العمل التجاري</title>
  <desc id="desc">خريطة مبنية على المصدر تربط أقسام لوحة النموذج والأنماط والتصميم والاستراتيجية بمراحل تصميم نموذج العمل الخمس.</desc>
  <rect width="1200" height="630" fill="#fffaf2"/>
  <rect x="44" y="42" width="1112" height="546" rx="28" fill="#ffffff" stroke="#20242a" stroke-width="4"/>
  <text x="1118" y="98" text-anchor="end" direction="rtl" fill="#20242a" font-family="Tahoma, Arial, sans-serif" font-size="38" font-weight="700">ابتكار نموذج العمل التجاري</text>
  <text x="1118" y="132" text-anchor="end" direction="rtl" fill="#5b6470" font-family="Tahoma, Arial, sans-serif" font-size="20">خريطة مبنية بالكامل على محتوى الكتاب</text>
  <g font-family="Tahoma, Arial, sans-serif" font-weight="700" text-anchor="middle" direction="rtl">
