  <text x="600" y="572" text-anchor="middle" direction="rtl" fill="#5b6470" font-family="Tahoma, Arial, sans-serif" font-size="17">مبنية فقط على فهرس الكتاب وعرض العملية: الصفحات المطبوعة 8–9 و248–259</text>
