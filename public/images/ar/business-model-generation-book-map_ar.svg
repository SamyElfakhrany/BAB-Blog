    <rect x="626" y="174" width="220" height="92" rx="16" fill="#ff8e63"/><text x="736" y="230" font-size="25" fill="#20242a">الأنماط</text>
    <rect x="898" y="174" width="220" height="92" rx="16" fill="#ffd86b"/><text x="1008" y="230" font-size="25" fill="#20242a">اللوحة</text>
  </g>
  <path d="M192 286v42h816v-42M464 286v42M736 286v42" fill="none" stroke="#20242a" stroke-width="5" stroke-linecap="round"/>
  <path d="M600 328v48" fill="none" stroke="#20242a" stroke-width="5"/>
  <path d="M585 359l15 18 15-18" fill="none" stroke="#20242a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="600" y="410" text-anchor="middle" direction="rtl" fill="#20242a" font-family="Tahoma, Arial, sans-serif" font-size="25" font-weight="700">عملية تصميم نموذج العمل</text>
