<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">دورة مراجعة تجربة المستخدم بالدليل</title><desc id="d">هدف المستخدم والسياق يقودان لمراجعة بالمبادئ ثم ترتيب المشكلات والتعديل والتحقق.</desc><rect width="1200" height="630" fill="#171335"/><g font-family="Arial" text-anchor="middle" direction="rtl"><text x="600" y="72" fill="#fff" font-size="38" font-weight="700">راجع التجربة، مش ذوقك الشخصي</text><text x="600" y="112" fill="#dcd5ff" font-size="21">هدف ← دليل ← مبدأ ← مخاطرة ← تحقق</text><g font-size="24" font-weight="700"><rect x="955" y="245" width="190" height="120" rx="20" fill="#f7c948"/><text x="1050" y="298" fill="#171335">هدف المستخدم</text><text x="1050" y="330" fill="#171335" font-size="17" font-weight="400">إرجاع منتج واحد</text><rect x="725" y="245" width="190" height="120" rx="20" fill="#fff"/><text x="820" y="290" fill="#171335">مبدأ UX</text><text x="820" y="322" fill="#4c437b" font-size="17" font-weight="400">حالة • تحكم</text><text x="820" y="346" fill="#4c437b" font-size="17" font-weight="400">أخطاء • اتساق</text><rect x="495" y="245" width="190" height="120" rx="20" fill="#9b8ad9"/><text x="590" y="298" fill="#171335">مشكلة ومخاطرة</text><text x="590" y="330" fill="#171335" font-size="17" font-weight="400">دليل وتأثير</text><rect x="265" y="245" width="190" height="120" rx="20" fill="#77a6d3"/><text x="360" y="298" fill="#102a43">تعديل</text><text x="360" y="330" fill="#102a43" font-size="17" font-weight="400">أصغر حل مفيد</text><rect x="55" y="245" width="170" height="120" rx="20" fill="#7dd3a8"/><text x="140" y="298" fill="#102a43">تحقق</text><text x="140" y="330" fill="#102a43" font-size="17" font-weight="400">اختبر المهمة</text></g><g stroke="#dcd5ff" stroke-width="7"><path d="M950 305h-30M720 305h-30M490 305h-30M260 305h-30"/></g><text x="600" y="495" fill="#fff" font-size="25" font-weight="700">«رسالة التأكيد ناقصة» ملاحظة قابلة للتنفيذ.</text><text x="600" y="535" fill="#dcd5ff" font-size="22">«مش عاجباني الشاشة» مش ملاحظة مفيدة.</text></g></svg>
