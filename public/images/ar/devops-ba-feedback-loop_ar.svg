<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">حلقة DevOps لمحلل الأعمال</title>
  <desc id="desc">التغيير ينتقل من التخطيط إلى البناء والتحقق والإطلاق والمراقبة، ثم ترجع أدلة الإنتاج للخطة التالية، مع دور محلل الأعمال ومسار الرجوع.</desc>
  <defs>
    <linearGradient id="bg" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071827"/>
      <stop offset="1" stop-color="#112a3d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity=".32"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L12 6L0 12Z" fill="#5eead4"/>
    </marker>
    <marker id="warnArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L12 6L0 12Z" fill="#fbbf24"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="28" fill="url(#bg)"/>
  <text x="1130" y="70" text-anchor="start" direction="rtl" fill="#f8fafc" font-family="Arial, Tahoma, sans-serif" font-size="34" font-weight="700">DevOps يحوّل التسليم لحلقة تعلّم</text>
  <text x="1130" y="106" text-anchor="start" direction="rtl" fill="#99f6e4" font-family="Arial, Tahoma, sans-serif" font-size="19">الـ BA يربط نتيجة المستخدم والدليل وقواعد التشغيل من الفكرة لحد الإنتاج.</text>

  <g filter="url(#shadow)" font-family="Arial, Tahoma, sans-serif">
    <rect x="938" y="165" width="190" height="150" rx="18" fill="#163145" stroke="#5eead4" stroke-width="2"/>
    <text x="1033" y="205" text-anchor="middle" fill="#5eead4" font-size="17" font-weight="700">١ · التخطيط</text>
    <text x="1033" y="242" text-anchor="middle" direction="rtl" fill="#f8fafc" font-size="23" font-weight="700">تحديد القيمة</text>
    <text x="1033" y="274" text-anchor="middle" direction="rtl" fill="#cbd5e1" font-size="16">قواعد · مخاطر · مقاييس</text>
    <text x="1033" y="297" text-anchor="middle" direction="rtl" fill="#fbbf24" font-size="14" font-weight="700">دور BA: توضيح النتيجة</text>

    <rect x="721" y="165" width="190" height="150" rx="18" fill="#163145" stroke="#5eead4" stroke-width="2"/>
    <text x="816" y="205" text-anchor="middle" fill="#5eead4" font-size="17" font-weight="700">٢ · البناء</text>
    <text x="816" y="242" text-anchor="middle" direction="rtl" fill="#f8fafc" font-size="23" font-weight="700">إنشاء التغيير</text>
    <text x="816" y="274" text-anchor="middle" direction="rtl" fill="#cbd5e1" font-size="16">نسخة صغيرة قابلة للتتبع</text>
    <text x="816" y="297" text-anchor="middle" direction="rtl" fill="#fbbf24" font-size="14" font-weight="700">دور BA: حفظ التتبع</text>

    <rect x="504" y="165" width="190" height="150" rx="18" fill="#163145" stroke="#5eead4" stroke-width="2"/>
    <text x="599" y="205" text-anchor="middle" fill="#5eead4" font-size="17" font-weight="700">٣ · التحقق</text>
    <text x="599" y="242" text-anchor="middle" direction="rtl" fill="#f8fafc" font-size="23" font-weight="700">مراجعة الدليل</text>
    <text x="599" y="274" text-anchor="middle" direction="rtl" fill="#cbd5e1" font-size="16">اختبارات · أمان · قواعد</text>
    <text x="599" y="297" text-anchor="middle" direction="rtl" fill="#fbbf24" font-size="14" font-weight="700">دور BA: تأكيد السلوك</text>

    <rect x="287" y="165" width="190" height="150" rx="18" fill="#163145" stroke="#5eead4" stroke-width="2"/>
    <text x="382" y="205" text-anchor="middle" fill="#5eead4" font-size="17" font-weight="700">٤ · الإطلاق</text>
    <text x="382" y="242" text-anchor="middle" direction="rtl" fill="#f8fafc" font-size="23" font-weight="700">التحكم في الإتاحة</text>
    <text x="382" y="274" text-anchor="middle" direction="rtl" fill="#cbd5e1" font-size="16">بوابة · Flag · رجوع</text>
    <text x="382" y="297" text-anchor="middle" direction="rtl" fill="#fbbf24" font-size="14" font-weight="700">دور BA: تأكيد الجاهزية</text>

    <rect x="70" y="165" width="190" height="150" rx="18" fill="#163145" stroke="#5eead4" stroke-width="2"/>
    <text x="165" y="205" text-anchor="middle" fill="#5eead4" font-size="17" font-weight="700">٥ · المراقبة</text>
    <text x="165" y="242" text-anchor="middle" direction="rtl" fill="#f8fafc" font-size="23" font-weight="700">التعلّم من الاستخدام</text>
    <text x="165" y="274" text-anchor="middle" direction="rtl" fill="#cbd5e1" font-size="16">صحة · نتائج · ملاحظات</text>
    <text x="165" y="297" text-anchor="middle" direction="rtl" fill="#fbbf24" font-size="14" font-weight="700">دور BA: مقارنة النتائج</text>
  </g>

  <g fill="none" stroke="#5eead4" stroke-width="4" marker-end="url(#arrow)">
    <path d="M938 240H920"/>
    <path d="M721 240H703"/>
    <path d="M504 240H486"/>
    <path d="M287 240H269"/>
    <path d="M165 326V375C165 405 190 420 220 420H980C1010 420 1033 400 1033 370V326"/>
  </g>
  <text x="599" y="405" text-anchor="middle" direction="rtl" fill="#5eead4" font-family="Arial, Tahoma, sans-serif" font-size="17" font-weight="700">دليل الإنتاج يغيّر الخطة التالية</text>

  <g filter="url(#shadow)" font-family="Arial, Tahoma, sans-serif">
    <rect x="200" y="475" width="800" height="125" rx="22" fill="#3b2f19" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="934" cy="537" r="36" fill="#fbbf24"/>
    <path d="M934 515v28M934 556h.1" stroke="#111827" stroke-width="8" stroke-linecap="round"/>
    <text x="875" y="515" text-anchor="start" direction="rtl" fill="#fde68a" font-size="18" font-weight="700">لو تعدّينا الحد المتفق عليه</text>
    <text x="875" y="549" text-anchor="start" direction="rtl" fill="#f8fafc" font-size="23" font-weight="700">أوقف الإتاحة ← عطّل أو ارجع ← أكد التعافي ← بلّغ المسؤول</text>
    <text x="875" y="577" text-anchor="start" direction="rtl" fill="#d6d3d1" font-size="16">الحد والصلاحية ورسالة العميل ودليل التعافي لازم يتحددوا قبل الإطلاق.</text>
  </g>
  <path d="M382 326V462" fill="none" stroke="#fbbf24" stroke-width="4" stroke-dasharray="9 9" marker-end="url(#warnArrow)"/>
  <text x="1130" y="642" text-anchor="start" direction="rtl" fill="#94a3b8" font-family="Arial, Tahoma, sans-serif" font-size="15">مسار توضيحي — كل مؤسسة تحدد ضوابطها وبيئاتها وصلاحيات الإطلاق.</text>
</svg>
