<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">مسار قائم على الأدلة لاختيار فرصة ذكاء اصطناعي</title>
  <desc id="desc">تمر فكرة الذكاء الاصطناعي بأربع بوابات: الاحتياج والدليل، وملاءمة القدرة، والجدوى والبيانات، والتأثير والمخاطر. يتم إيقاف الأفكار الضعيفة، بينما تتحول الفكرة المحدودة والقابلة للقياس إلى تجربة مرشحة.</desc>
  <defs>
    <linearGradient id="bg" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123f3c"/>
      <stop offset="1" stop-color="#0a2532"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L12 6L0 12Z" fill="#67e8c8"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="28" fill="url(#bg)"/>
  <g font-family="Tahoma, Arial, sans-serif" direction="rtl">
    <text x="600" y="68" text-anchor="middle" fill="#f8fafc" font-size="34" font-weight="700">حوّل فكرة الـAI لقرار مبني على دليل</text>
    <text x="600" y="105" text-anchor="middle" fill="#a7f3d0" font-size="19">كل بوابة ممكن تنتج سؤالًا أو تجربة أو نطاقًا أصغر، أو قرار توقف مسؤولًا.</text>

    <g filter="url(#shadow)">
      <rect x="55" y="170" width="245" height="190" rx="22" fill="#5eead4" stroke="#2dd4bf" stroke-width="2"/>
      <circle cx="98" cy="211" r="22" fill="#134e4a"/>
      <text x="98" y="219" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">٤</text>
      <text x="177" y="206" text-anchor="middle" fill="#134e4a" font-size="15" font-weight="700">التأثير والمخاطر</text>
      <text x="177" y="254" text-anchor="middle" fill="#0f172a" font-size="23" font-weight="700">هل نكمل؟</text>
      <text x="177" y="291" text-anchor="middle" fill="#334155" font-size="16">فوائد · أضرار · سوء استخدام</text>
      <text x="177" y="321" text-anchor="middle" fill="#334155" font-size="16">مراجعة · بديل · حدود</text>
      <text x="177" y="346" text-anchor="middle" fill="#134e4a" font-size="14">وضّح قرار التنفيذ أو التوقف</text>

      <rect x="337" y="170" width="245" height="190" rx="22" fill="#99f6e4" stroke="#5eead4" stroke-width="2"/>
      <circle cx="380" cy="211" r="22" fill="#115e59"/>
      <text x="380" y="219" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">٣</text>
      <text x="459" y="206" text-anchor="middle" fill="#115e59" font-size="15" font-weight="700">الجدوى والبيانات</text>
      <text x="459" y="254" text-anchor="middle" fill="#0f172a" font-size="23" font-weight="700">نقدر نختبرها؟</text>
      <text x="459" y="291" text-anchor="middle" fill="#334155" font-size="16">بيانات مسموحة · تكامل</text>
      <text x="459" y="321" text-anchor="middle" fill="#334155" font-size="16">مسؤول · مهارات · قيود</text>
      <text x="459" y="346" text-anchor="middle" fill="#64748b" font-size="14">حدد الدليل التالي</text>

      <rect x="619" y="170" width="245" height="190" rx="22" fill="#ccfbf1" stroke="#5eead4" stroke-width="2"/>
      <circle cx="662" cy="211" r="22" fill="#0f766e"/>
      <text x="662" y="219" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">٢</text>
      <text x="741" y="206" text-anchor="middle" fill="#0f766e" font-size="15" font-weight="700">ملاءمة القدرة</text>
      <text x="741" y="254" text-anchor="middle" fill="#0f172a" font-size="23" font-weight="700">هل الـAI يضيف قيمة؟</text>
      <text x="741" y="291" text-anchor="middle" fill="#334155" font-size="16">قواعد · عملية · اختيارات AI</text>
      <text x="741" y="321" text-anchor="middle" fill="#334155" font-size="16">ناتج مرتبط بقرار</text>
      <text x="741" y="346" text-anchor="middle" fill="#64748b" font-size="14">فضّل أبسط اختيار مناسب</text>

      <rect x="901" y="170" width="245" height="190" rx="22" fill="#ecfdf5" stroke="#5eead4" stroke-width="2"/>
      <circle cx="944" cy="211" r="22" fill="#0f766e"/>
      <text x="944" y="219" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">١</text>
      <text x="1023" y="206" text-anchor="middle" fill="#0f766e" font-size="15" font-weight="700">الاحتياج والدليل</text>
      <text x="1023" y="254" text-anchor="middle" fill="#0f172a" font-size="23" font-weight="700">هل المشكلة حقيقية؟</text>
      <text x="1023" y="291" text-anchor="middle" fill="#334155" font-size="16">Baseline · مستخدمون · قرارات</text>
      <text x="1023" y="321" text-anchor="middle" fill="#334155" font-size="16">تكلفة الوضع الحالي</text>
      <text x="1023" y="346" text-anchor="middle" fill="#64748b" font-size="14">سجّل الافتراضات بوضوح</text>
    </g>

    <g fill="none" stroke="#67e8c8" stroke-width="4" marker-end="url(#arrow)">
      <path d="M901 265H874"/>
      <path d="M619 265H592"/>
      <path d="M337 265H310"/>
    </g>

    <g filter="url(#shadow)">
      <rect x="90" y="440" width="440" height="130" rx="24" fill="#143d39" stroke="#67e8c8" stroke-width="2"/>
      <text x="310" y="479" text-anchor="middle" fill="#67e8c8" font-size="16" font-weight="700">مرشح لتجربة محدودة</text>
      <text x="310" y="516" text-anchor="middle" fill="#f8fafc" font-size="23" font-weight="700">قابل للقياس · المراجعة · الرجوع</text>
      <text x="310" y="548" text-anchor="middle" fill="#a7f3d0" font-size="15">ابدأ تحليل البيانات والمتطلبات والتقييم بالتفصيل.</text>

      <rect x="670" y="440" width="440" height="130" rx="24" fill="#3f2631" stroke="#fb7185" stroke-width="2"/>
      <text x="890" y="479" text-anchor="middle" fill="#fda4af" font-size="16" font-weight="700">أجّل أو أعد التصميم أو توقف</text>
      <text x="890" y="516" text-anchor="middle" fill="#f8fafc" font-size="23" font-weight="700">دليل أو ضابط أساسي ناقص</text>
      <text x="890" y="548" text-anchor="middle" fill="#fecdd3" font-size="15">سجّل السبب، وإيه اللي ممكن يغيّر القرار.</text>
    </g>
    <text x="600" y="635" text-anchor="middle" fill="#94a3b8" font-size="15">المسار للتعليم؛ لازم المؤسسة تتفق على التقييم والحدود المناسبة لحالة الاستخدام.</text>
  </g>
</svg>
