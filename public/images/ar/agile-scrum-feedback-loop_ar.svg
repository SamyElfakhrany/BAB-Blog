<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">حلقة التعلّم في Agile و Scrum</title>
  <desc id="desc">هدف المنتج يوجّه قائمة المنتج المرتبة. يحوّل الـSprint العمل المختار إلى جزء صالح للاستخدام. ملاحظات المراجعة وتعلّم جلسة التحسين يحدّثان القائمة وطريقة عمل الفريق.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071c2e"/>
      <stop offset="1" stop-color="#103d4a"/>
    </linearGradient>
    <linearGradient id="sprint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb65c"/>
      <stop offset="1" stop-color="#ff7a45"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#00111c" flood-opacity=".3"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#7ce0cf"/>
    </marker>
  </defs>
  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <circle cx="140" cy="120" r="220" fill="#1f6670" opacity=".22"/>
  <circle cx="1480" cy="800" r="300" fill="#ff8d55" opacity=".12"/>

  <g font-family="Tahoma, Arial, sans-serif" direction="rtl">
    <text x="1470" y="105" text-anchor="start" fill="#7ce0cf" font-size="28" font-weight="700">عقلية AGILE</text>
    <text x="1470" y="158" text-anchor="start" fill="#ffffff" font-size="46" font-weight="700">قدّم قيمة، راجع الدليل، وتعلّم</text>
    <text x="1470" y="203" text-anchor="start" fill="#c6dbe0" font-size="25">Scrum بيعمل حلقة تعلّم منتظمة للشغل المعقّد.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="90" y="330" width="360" height="250" rx="30" fill="#f4fbfa"/>
    <rect x="620" y="292" width="360" height="326" rx="40" fill="url(#sprint)"/>
    <rect x="1150" y="330" width="360" height="250" rx="30" fill="#f4fbfa"/>
  </g>

  <g font-family="Tahoma, Arial, sans-serif" direction="rtl">
    <text x="1330" y="390" text-anchor="middle" fill="#123849" font-size="23" font-weight="700">قائمة المنتج</text>
    <text x="1330" y="443" text-anchor="middle" fill="#071c2e" font-size="34" font-weight="700">شغل مرتب</text>
    <text x="1330" y="491" text-anchor="middle" fill="#355b67" font-size="23">يوجّهه هدف المنتج</text>
    <g fill="#2d8c82">
      <rect x="1225" y="520" width="210" height="12" rx="6"/>
      <rect x="1245" y="548" width="170" height="12" rx="6" opacity=".65"/>
    </g>

    <text x="800" y="360" text-anchor="middle" fill="#4b210d" font-size="23" font-weight="700">SPRINT</text>
    <text x="800" y="417" text-anchor="middle" fill="#2b160d" font-size="36" font-weight="700">التركيز على هدف واحد</text>
    <text x="800" y="466" text-anchor="middle" fill="#5a2b18" font-size="23">خطط • تعاون • راجع يوميًا</text>
    <circle cx="800" cy="536" r="38" fill="#fff5e8"/>
    <path d="M800 514 v25 l17 12" fill="none" stroke="#b44822" stroke-width="9" stroke-linecap="round"/>

    <text x="270" y="390" text-anchor="middle" fill="#123849" font-size="23" font-weight="700">الجزء الناتج</text>
    <text x="270" y="443" text-anchor="middle" fill="#071c2e" font-size="34" font-weight="700">قيمة قابلة للاستخدام</text>
    <text x="270" y="491" text-anchor="middle" fill="#355b67" font-size="23">تطابق تعريف الاكتمال</text>
    <circle cx="270" cy="544" r="30" fill="#2d8c82"/>
    <path d="M255 544 l11 12 23 -27" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <path d="M1145 455 H1005" fill="none" stroke="#7ce0cf" stroke-width="12" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M615 455 H475" fill="none" stroke="#7ce0cf" stroke-width="12" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M270 620 C270 760 1330 760 1330 620" fill="none" stroke="#7ce0cf" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g font-family="Tahoma, Arial, sans-serif" text-anchor="middle" direction="rtl">
    <rect x="485" y="681" width="630" height="102" rx="26" fill="#0a2636" stroke="#2d8c82" stroke-width="3"/>
    <text x="800" y="724" fill="#ffffff" font-size="28" font-weight="700">راجع النتيجة وطريقة تعاون الفريق</text>
    <text x="800" y="759" fill="#a8ccc9" font-size="22">حدّث القائمة والافتراضات والتجربة الجاية</text>
  </g>
</svg>
