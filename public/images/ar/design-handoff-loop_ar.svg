<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">عقد مشترك بين التصميم والتطوير</title><desc id="d">الهدف المتحقق يربط التصميم والمكونات والحالات والكود ودليل القبول.</desc><rect width="1200" height="630" fill="#171335"/><g font-family="Arial" text-anchor="middle" direction="rtl"><text x="600" y="70" fill="#fff" font-size="38" font-weight="700">الـHandoff عقد مشترك، مش رمي ملف</text><g font-size="22" font-weight="700"><rect x="950" y="215" width="190" height="130" rx="18" fill="#f7c948"/><text x="1045" y="270" fill="#102a43">الهدف</text><text x="1045" y="307" fill="#102a43" font-size="17" font-weight="400">نتيجة • قاعدة • نطاق</text><rect x="730" y="215" width="190" height="130" rx="18" fill="#9b8ad9"/><text x="825" y="270" fill="#171335">تصميم</text><text x="825" y="307" fill="#171335" font-size="17" font-weight="400">تدفق • حالات • نص</text><rect x="510" y="215" width="190" height="130" rx="18" fill="#fff"/><text x="605" y="270" fill="#102a43">نظام</text><text x="605" y="307" fill="#486581" font-size="17" font-weight="400">Component • Token</text><rect x="290" y="215" width="190" height="130" rx="18" fill="#77a6d3"/><text x="385" y="270" fill="#102a43">تنفيذ</text><text x="385" y="307" fill="#102a43" font-size="17" font-weight="400">سلوك Responsive</text><rect x="70" y="215" width="190" height="130" rx="18" fill="#7dd3a8"/><text x="165" y="270" fill="#102a43">قبول</text><text x="165" y="307" fill="#102a43" font-size="17" font-weight="400">دليل • قرار</text></g><g stroke="#dcd5ff" stroke-width="7"><path d="M945 280h-20M725 280h-20M505 280h-20M285 280h-20"/></g><path d="M165 375c0 115 880 115 880 0" stroke="#9b8ad9" stroke-width="6" fill="none"/><path d="M1030 458l20 17-25 10" fill="#9b8ad9"/><text x="600" y="535" fill="#dcd5ff" font-size="21">الأسئلة والاكتشافات ترجع بدري قبل ما تتحول لعيوب مكلفة.</text></g></svg>
