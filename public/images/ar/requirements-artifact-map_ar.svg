<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">اختيار أداة المتطلبات المناسبة للقرار</title><desc id="desc">احتياج العمل يمر عبر مستند وتدفق عملية وحالة استخدام ووايرفريم وصولًا لقرار مشترك.</desc><rect width="1200" height="630" fill="#081b2b"/><g font-family="Arial" direction="rtl" text-anchor="middle"><text x="600" y="66" fill="#fff" font-size="34" font-weight="700">اختار الأداة على حسب القرار</text><rect x="930" y="245" width="210" height="125" rx="20" fill="#ff8a3d"/><text x="1035" y="300" fill="#081b2b" font-size="25" font-weight="700">احتياج العمل</text><text x="1035" y="334" fill="#081b2b" font-size="18">نتيجة + نطاق</text><rect x="640" y="125" width="210" height="100" rx="16" fill="#173a54" stroke="#8ee3c5" stroke-width="3"/><text x="745" y="170" fill="#fff" font-size="23" font-weight="700">BRD / PRD</text><text x="745" y="200" fill="#cfe8f5" font-size="17">ليه وإيه</text><rect x="640" y="255" width="210" height="100" rx="16" fill="#173a54" stroke="#8ee3c5" stroke-width="3"/><text x="745" y="300" fill="#fff" font-size="23" font-weight="700">تدفق العملية</text><text x="745" y="330" fill="#cfe8f5" font-size="17">خطوات وتسليمات</text><rect x="640" y="385" width="210" height="100" rx="16" fill="#173a54" stroke="#8ee3c5" stroke-width="3"/><text x="745" y="430" fill="#fff" font-size="23" font-weight="700">حالة استخدام</text><text x="745" y="460" fill="#cfe8f5" font-size="17">سلوك واستثناءات</text><rect x="350" y="245" width="210" height="125" rx="20" fill="#173a54" stroke="#65b9ff" stroke-width="3"/><text x="455" y="300" fill="#fff" font-size="25" font-weight="700">Wireframe</text><text x="455" y="334" fill="#cfe8f5" font-size="18">ترتيب ومحتوى</text><rect x="60" y="245" width="210" height="125" rx="20" fill="#8ee3c5"/><text x="165" y="295" fill="#081b2b" font-size="24" font-weight="700">قرار مشترك</text><text x="165" y="330" fill="#081b2b" font-size="18">مراجعة وتحقق</text><text x="600" y="570" fill="#cfe8f5" font-size="21">استخدم أقل مجموعة أدوات تزيل عدم الوضوح عند الفريق.</text></g><path d="M925 307H860" stroke="#8ee3c5" stroke-width="8"/><path d="M870 294l-18 13 18 13" fill="#8ee3c5"/><path d="M635 307H565" stroke="#65b9ff" stroke-width="8"/><path d="M575 294l-18 13 18 13" fill="#65b9ff"/><path d="M345 307H280" stroke="#ff8a3d" stroke-width="8"/><path d="M290 294l-18 13 18 13" fill="#ff8a3d"/></svg>
