<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">دورة عمل محلل الأعمال خلال المشروع</title>
  <desc id="desc">سبع مراحل مترابطة توضح عمل محلل الأعمال من تحديد الاحتياج إلى قياس القيمة، ثم عودة التعلم للاحتياج.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#4f46e5"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title{font:700 36px Tahoma,Arial,sans-serif;fill:#0f172a}
      .subtitle{font:400 20px Tahoma,Arial,sans-serif;fill:#475569}
      .n{font:700 18px Tahoma,Arial,sans-serif;fill:#fff}
      .stage{font:700 21px Tahoma,Arial,sans-serif;fill:#172554}
      .work{font:400 17px Tahoma,Arial,sans-serif;fill:#334155}
      .loop{font:600 17px Tahoma,Arial,sans-serif;fill:#4338ca}
    </style>
  </defs>
  <rect width="1280" height="760" rx="28" fill="url(#bg)"/>
  <g direction="rtl" unicode-bidi="bidi-override">
    <text class="title" x="640" y="62" text-anchor="middle">محلل الأعمال يحافظ على رابط القيمة خلال دورة المشروع</text>
    <text class="subtitle" x="640" y="96" text-anchor="middle">احتياج ← قرارات ← متطلبات ← تنفيذ ← دليل</text>
  </g>

  <g fill="none" stroke="#4f46e5" stroke-width="4" marker-end="url(#arrow)">
    <path d="M974 220H930"/>
    <path d="M666 220H622"/>
    <path d="M358 220H314"/>
    <path d="M182 304V370"/>
    <path d="M314 456H358"/>
    <path d="M622 456H666"/>
    <path d="M798 528V626H1106V304" stroke-dasharray="10 9"/>
  </g>

  <g filter="url(#shadow)" direction="rtl">
    <g transform="translate(974 148)">
      <rect width="264" height="144" rx="20" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
      <circle cx="230" cy="34" r="20" fill="#4f46e5"/><text class="n" x="230" y="41" text-anchor="middle">١</text>
      <text class="stage" x="125" y="41" text-anchor="middle">حدد الاحتياج</text>
      <text class="work" x="125" y="84" text-anchor="middle"><tspan x="125">المشكلة والدليل والأطراف</tspan><tspan x="125" dy="27">والنتائج المطلوبة</tspan></text>
    </g>
    <g transform="translate(666 148)">
      <rect width="264" height="144" rx="20" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
      <circle cx="230" cy="34" r="20" fill="#4f46e5"/><text class="n" x="230" y="41" text-anchor="middle">٢</text>
      <text class="stage" x="125" y="41" text-anchor="middle">حدد الاتجاه</text>
      <text class="work" x="125" y="84" text-anchor="middle"><tspan x="125">النطاق والقيود والبدائل</tspan><tspan x="125" dy="27">والقرارات</tspan></text>
    </g>
    <g transform="translate(358 148)">
      <rect width="264" height="144" rx="20" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
      <circle cx="230" cy="34" r="20" fill="#4f46e5"/><text class="n" x="230" y="41" text-anchor="middle">٣</text>
      <text class="stage" x="125" y="41" text-anchor="middle">خطط للتحليل</text>
      <text class="work" x="125" y="84" text-anchor="middle"><tspan x="125">المشاركة والتفاصيل</tspan><tspan x="125" dy="27">والتتبع والتغيير</tspan></text>
    </g>
    <g transform="translate(50 148)">
      <rect width="264" height="144" rx="20" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
      <circle cx="230" cy="34" r="20" fill="#4f46e5"/><text class="n" x="230" y="41" text-anchor="middle">٤</text>
      <text class="stage" x="125" y="41" text-anchor="middle">شكّل التغيير</text>
      <text class="work" x="125" y="84" text-anchor="middle"><tspan x="125">المتطلبات والقواعد</tspan><tspan x="125" dy="27">والنماذج والقبول</tspan></text>
    </g>
    <g transform="translate(50 384)">
      <rect width="264" height="144" rx="20" fill="#ffffff" stroke="#a7f3d0" stroke-width="2"/>
      <circle cx="230" cy="34" r="20" fill="#059669"/><text class="n" x="230" y="41" text-anchor="middle">٥</text>
      <text class="stage" x="125" y="41" text-anchor="middle">ادعم التنفيذ</text>
      <text class="work" x="125" y="84" text-anchor="middle"><tspan x="125">التوضيح والمراجعة والتتبع</tspan><tspan x="125" dy="27">وتحليل التغيير</tspan></text>
    </g>
    <g transform="translate(358 384)">
      <rect width="264" height="144" rx="20" fill="#ffffff" stroke="#a7f3d0" stroke-width="2"/>
      <circle cx="230" cy="34" r="20" fill="#059669"/><text class="n" x="230" y="41" text-anchor="middle">٦</text>
      <text class="stage" x="125" y="41" text-anchor="middle">تحقق واستعد</text>
      <text class="work" x="125" y="84" text-anchor="middle"><tspan x="125">اختبار النتائج والجاهزية</tspan><tspan x="125" dy="27">ومسارات الاستثناء</tspan></text>
    </g>
    <g transform="translate(666 384)">
      <rect width="264" height="144" rx="20" fill="#ffffff" stroke="#fcd34d" stroke-width="2"/>
      <circle cx="230" cy="34" r="20" fill="#d97706"/><text class="n" x="230" y="41" text-anchor="middle">٧</text>
      <text class="stage" x="125" y="41" text-anchor="middle">قِس القيمة</text>
      <text class="work" x="125" y="84" text-anchor="middle"><tspan x="125">قارن النتائج بخط الأساس</tspan><tspan x="125" dy="27">واتعلم منها</tspan></text>
    </g>
  </g>

  <rect x="350" y="636" width="572" height="70" rx="35" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="2"/>
  <text class="loop" x="636" y="680" text-anchor="middle" direction="rtl">التعلّم يكشف احتياجًا جديدًا أو يغيّر الاحتياج الحالي</text>
</svg>
