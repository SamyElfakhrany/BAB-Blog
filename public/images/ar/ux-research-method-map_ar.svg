<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">اختيار طريقة بحث تجربة المستخدم من السؤال</title><desc id="d">أسئلة الاستكشاف والتقييم ترتبط بطرق بحث نوعية وكمية.</desc><rect width="1200" height="630" fill="#f7f9fb"/><g font-family="Arial" direction="rtl"><text x="600" y="70" text-anchor="middle" fill="#102a43" font-size="38" font-weight="700">ابدأ بالسؤال، وبعدها اختار طريقة البحث</text><line x1="600" y1="145" x2="600" y2="545" stroke="#9b8ad9" stroke-width="4"/><line x1="85" y1="340" x2="1115" y2="340" stroke="#9b8ad9" stroke-width="4"/><text x="1080" y="132" text-anchor="end" fill="#4c437b" font-size="22" font-weight="700">استكشاف</text><text x="120" y="132" fill="#4c437b" font-size="22" font-weight="700">تقييم</text><text x="1105" y="370" text-anchor="end" fill="#4c437b" font-size="20" font-weight="700">نوعي</text><text x="65" y="370" fill="#4c437b" font-size="20" font-weight="700">كمي</text><g font-size="24" text-anchor="middle"><rect x="705" y="175" width="360" height="120" rx="18" fill="#fff" stroke="#77a6d3" stroke-width="3"/><text x="885" y="225" fill="#102a43" font-weight="700">ليه ده بيحصل؟</text><text x="885" y="263" fill="#486581" font-size="19">مقابلات • ملاحظة ميدانية</text><rect x="135" y="175" width="360" height="120" rx="18" fill="#fff" stroke="#7dd3a8" stroke-width="3"/><text x="315" y="225" fill="#102a43" font-weight="700">الاحتكاك فين؟</text><text x="315" y="263" fill="#486581" font-size="19">اختبار استخدام نوعي</text><rect x="705" y="390" width="360" height="120" rx="18" fill="#fff" stroke="#f39c6b" stroke-width="3"/><text x="885" y="440" fill="#102a43" font-weight="700">الاحتياج منتشر قد إيه؟</text><text x="885" y="478" fill="#486581" font-size="19">استبيان • تحليلات المنتج</text><rect x="135" y="390" width="360" height="120" rx="18" fill="#fff" stroke="#9b8ad9" stroke-width="3"/><text x="315" y="440" fill="#102a43" font-weight="700">أي اختيار أداؤه أفضل؟</