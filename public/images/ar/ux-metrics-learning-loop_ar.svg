<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">دورة تعلم تجربة المستخدم من السلوك للنتيجة</title><desc id="d">مهمة وافتراض يقودان لملاحظة الاستخدام ومقاييس المنتج ثم قرار ودورة جديدة.</desc><rect width="1200" height="630" fill="#f7f9fb"/><g font-family="Arial" text-anchor="middle" direction="rtl"><text x="600" y="70" fill="#102a43" font-size="38" font-weight="700">اجمع التفسير مع القياس</text><circle cx="600" cy="325" r="190" fill="none" stroke="#9b8ad9" stroke-width="10" stroke-dasharray="250 55"/><g font-size="21" font-weight="700"><rect x="485" y="112" width="230" height="74" rx="16" fill="#f7c948"/><text x="600" y="157" fill="#102a43">مهمة وافتراض</text><rect x="140" y="270" width="250" height="90" rx="16" fill="#77a6d3"/><text x="265" y="307" fill="#102a43">اختبار نوعي</text><text x="265" y="337" fill="#102a43" font-size="16" font-weight="400">ليه وفين؟</text><rect x="475" y="465" width="250" height="90" rx="16" fill="#7dd3a8"/><text x="600" y="502" fill="#102a43">مقاييس المنتج</text><text x="600" y="532" fill="#102a43" font-size="16" font-weight="400">كام وقد إيه؟</text><rect x="810" y="270" width="250" height="90" rx="16" fill="#40366f"/><text x="935" y="307" fill="#fff">قرار</text><text x="935" y="337" fill="#dcd5ff" font-size="16" font-weight="400">عدّل • ثبّت • ابحث</text></g><text x="600" y="305" fill="#102a43" font-size="27" font-weight="700">نتيجة المستخدم</text><text x="600" y="343" fill="#486581" font-size="20">نجاح • مجهود • ثقة</text></g></svg>
